<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>科技股雷达 · 个人盯盘</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232d;--border:#2a313c;--text:#e6edf3;--muted:#8b949e;--up:#f5455c;--down:#22c55e;--accent:#3b82f6;--warn:#f59e0b;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg)}
body{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);font-size:13px}
button,input,select{font:inherit}
[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.up{color:var(--up)!important}.down{color:var(--down)!important}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;white-space:nowrap}.brand .logo{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;user-select:none}
.tab:hover{color:var(--text)}.tab.active{background:var(--panel2);color:var(--text)}
.spacer{flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.status{padding:3px 10px;border-radius:12px;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.status.live{background:rgba(34,197,94,.15);color:var(--down)}
.status.degraded{background:rgba(245,158,11,.15);color:var(--warn)}
.status.sim{background:rgba(139,148,158,.15);color:var(--muted)}
.status .dot.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55)}
.btn.danger{background:rgba(245,69,92,.14);border-color:rgba(245,69,92,.45)}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.idxbar{display:flex;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.idx{display:flex;align-items:baseline;gap:8px;padding:5px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:.15s}
.idx:hover{border-color:var(--accent)}
.idx .nm{color:var(--muted);font-size:12px}
.idx .px,.idx .pc{font-variant-numeric:tabular-nums}.idx .px{font-weight:700}.idx .pc{font-size:12px}
.pulsebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px 14px 0}
.pulse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;min-width:0;position:relative;overflow:hidden}
.pulse-card::after{content:"";position:absolute;right:-22px;top:-22px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 70%)}
.pulse-card .k{color:var(--muted);font-size:11px;margin-bottom:6px}
.pulse-card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse-card .sub{color:var(--muted);font-size:11px;margin-top:5px;line-height:1.4}
.pulse-card.hot{border-color:rgba(245,69,92,.45);background:linear-gradient(145deg,rgba(245,69,92,.12),var(--panel))}
.pulse-card.blue{border-color:rgba(59,130,246,.4);background:linear-gradient(145deg,rgba(59,130,246,.12),var(--panel))}
.main{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr) 306px;gap:10px;padding:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h3{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.panel h3 .cnt{color:var(--muted);font-weight:400;font-size:11px}
.panel h3 .h3-right{display:flex;align-items:center;gap:6px}
.sectors{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-bottom:1px solid var(--border);max-height:190px;flex-shrink:0}
.sec{padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sec:hover{background:var(--panel2);color:var(--text)}
.sec.active{background:var(--accent);color:#fff}
.sec .c{font-size:11px;opacity:.8}
/* 分组条 */
.groupbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
.groupbar::-webkit-scrollbar{height:4px}
.gpill{padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--muted);cursor:pointer;font-size:11px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.gpill:hover{border-color:var(--accent);color:var(--text)}
.gpill.active{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55);color:#fff}
.gpill .gc{opacity:.7;font-variant-numeric:tabular-nums}
.gpill.add{border-style:dashed}
.searchbox{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.searchbox input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.searchbox input:focus{border-color:var(--accent)}
.search-hint{display:none;margin-top:6px;font-size:11px;color:var(--warn);line-height:1.5}
.search-hint.show{display:block}.search-hint.info{color:#93c5fd}
.search-result{position:absolute;top:46px;left:8px;right:8px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;z-index:30;max-height:240px;overflow-y:auto;display:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.search-result.show{display:block}
.sr-item{padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--border)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--accent)}
.sr-item .muted{opacity:.65;font-size:11px}
.manage-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}
.manage-bar .pick-all{display:flex;align-items:center;gap:5px;color:var(--muted)}
.mini-btn{padding:2px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--muted);cursor:pointer;font-size:11px}
.mini-btn:hover{border-color:var(--accent);color:var(--text)}
.stocklist{flex:1;overflow-y:auto}
.stk{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.stk:hover{background:var(--panel2)}
.stk.sel{background:var(--panel2);border-left:2px solid var(--accent);padding-left:10px}
.stk .pick{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.stk .info{flex:1;min-width:0}
.stk .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .cd{color:var(--muted);font-size:11px}
.stk .badges{display:inline-flex;gap:3px;margin-left:4px}
.stk .bdg{font-size:10px;padding:0 4px;border-radius:3px;line-height:1.5}
.stk .bdg.alert{background:rgba(245,158,11,.16);color:var(--warn)}
.stk .rt{text-align:right;flex-shrink:0}
.stk .px,.stk .pc{font-variant-numeric:tabular-nums}.stk .px{font-size:12px}.stk .pc{font-size:11px}
.stk .del{color:var(--muted);background:none;border:none;cursor:pointer;font-size:16px;flex-shrink:0;opacity:0;line-height:1;padding:2px}
.stk:hover .del{opacity:1}.stk .del:hover{color:var(--up)}
body.manage-mode .stk .del{opacity:1}
.detail-head{padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.dh-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dh-name{font-size:18px;font-weight:700}.dh-code{color:var(--muted)}
.tag{padding:2px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--muted)}
.dh-price{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.dh-price .px{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.dh-price .chg{font-size:14px;font-variant-numeric:tabular-nums}
.dh-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 16px}
.dh-stat{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.dh-stat .l{color:var(--muted)}.dh-stat .v{font-variant-numeric:tabular-nums}
.chart-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chart-tabs{display:flex;align-items:center;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.chart-tab{padding:5px 14px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:12px}
.chart-tab:hover{color:var(--text)}.chart-tab.active{background:var(--panel2);color:var(--text)}
.chart-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{padding:3px 9px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55);color:#fff}
canvas{flex:1;width:100%;min-height:0;display:block}
.alert-list{flex:1;overflow-y:auto}
.alert-tabs{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.alert-tab{padding:4px 10px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:11px;flex:1;text-align:center}
.alert-tab:hover{color:var(--text)}
.alert-tab.active{background:var(--panel2);color:var(--text)}
.alert-tab .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;background:var(--up);color:#fff;border-radius:8px;font-size:10px;line-height:16px;text-align:center}
.alert-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;position:relative}
.alert-item:hover{background:var(--panel2)}
.alert-item.severe{border-left:3px solid var(--up)}
.alert-item.severe.down-event{border-left-color:var(--down)}
.alert-item .at{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.alert-item .t{color:var(--muted);font-size:11px;flex-shrink:0}
.alert-item .d{color:var(--muted);word-break:break-all}
.pa-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;position:relative}
.pa-item:hover{background:var(--panel2)}
.pa-item.triggered{opacity:.55}
.pa-item .pa-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:3px}
.pa-item .pa-nm{font-weight:600}
.pa-item .pa-nm .cd{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}
.pa-item .pa-dir{font-size:11px;padding:1px 6px;border-radius:3px}
.pa-item .pa-dir.above{background:rgba(245,69,92,.16);color:var(--up)}
.pa-item .pa-dir.below{background:rgba(34,197,94,.16);color:var(--down)}
.pa-item .pa-body{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-top:4px}
.pa-item .pa-body .now{font-variant-numeric:tabular-nums}
.pa-item .pa-del{position:absolute;right:8px;top:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;opacity:0;line-height:1;padding:2px}
.pa-item:hover .pa-del{opacity:1}
.pa-item .pa-del:hover{color:var(--up)}
.pa-item.triggered .pa-del{opacity:1}
.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.review,.source-view{flex:1;overflow-y:auto;padding:16px;display:none;background:var(--bg)}
.review.show,.source-view.show{display:block}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.rv-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;min-width:0}
.rv-card.wide{grid-column:1/-1}
.rv-card h4{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.rank-row:last-child{border-bottom:none}.rank-row:hover{background:var(--panel2)}
.rank-row .no{width:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .cd{color:var(--muted);font-size:11px;margin-left:4px}
.rank-row .v{font-variant-numeric:tabular-nums;font-weight:600}
.heat-row{padding:9px 14px;border-bottom:1px solid var(--border)}
.heat-row:last-child{border-bottom:none}
.heat-row .ht{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:10px}
.heat-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.heat-fill{height:100%;border-radius:3px;transition:width .4s}
.ov-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.ov-item:last-of-type{border-bottom:none}.ov-item:hover{background:var(--panel2)}
.ov-item .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.disc{margin:10px 14px 14px;padding:10px 12px;background:var(--panel2);border-radius:7px;color:var(--muted);font-size:11px;line-height:1.8}
.ai-box{padding:14px;line-height:1.9;font-size:13px}
.ai-summary{white-space:pre-wrap}
.quote-link{color:#93c5fd;cursor:pointer;border-bottom:1px dashed rgba(147,197,253,.45);padding-bottom:1px}
.quote-link:hover{color:#fff}
.src-hero{background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(167,139,250,.10));border:1px solid rgba(59,130,246,.35);border-radius:12px;padding:18px;margin-bottom:12px}
.src-hero h2{font-size:18px;margin-bottom:6px}
.src-hero p{color:var(--muted);font-size:12px;line-height:1.75;margin-bottom:10px}
.src-status{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.src-status.ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);color:var(--down)}
.src-status.warn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.4);color:var(--warn)}
.src-status.sim{background:rgba(139,148,158,.14);border-color:rgba(139,148,158,.4);color:var(--muted)}
.src-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.src-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.src-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-width:0}
.src-card h4{font-size:13px;margin-bottom:10px}
.src-card .src-num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.src-card .src-sub{color:var(--muted);font-size:11px;line-height:1.6;margin-top:4px}
.src-config{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.src-config h4{font-size:13px;margin-bottom:10px}
.interval-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:12px}
.interval-pill input{display:none}
.interval-pill span{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:var(--panel2);color:var(--muted);font-size:12px;transition:.15s}
.interval-pill input:checked+span{border-color:var(--accent);background:rgba(59,130,246,.16);color:#fff}
.src-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.src-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.src-table th,.src-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.src-table th{color:var(--muted);font-weight:600}
.src-table td:last-child{color:var(--muted)}
.field{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.field label{color:var(--muted);font-size:12px;min-width:96px}
.field input[type=text]{flex:1;min-width:200px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.field input:focus{border-color:var(--accent)}
.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(760px,96vw);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.55)}
.modal.small{width:min(420px,96vw)}
.modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);background:rgba(22,27,34,.96)}
.modal-head h2{font-size:15px;margin-bottom:4px}
.modal-head p{font-size:11px;line-height:1.5;color:var(--muted)}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel2)}
.modal input[type=text],.modal input[type=number]{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal input[type=checkbox],.modal input[type=radio]{accent-color:var(--accent)}
.form-section{font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 8px}
.radio-line{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfg-row{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)}
.cfg-row.disabled{opacity:.62}
.cfg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px}
.cfg-sub{color:var(--muted);font-size:11px}
.cfg-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfg-fields.single{grid-template-columns:1fr}
.cfg-fields label{font-size:11px;color:var(--muted)}
.cfg-fields input{margin-top:4px}
.form-hint{margin-top:7px;font-size:11px;line-height:1.6;color:var(--muted)}
.form-hint.info{color:#93c5fd}
.form-error{min-height:18px;margin-top:9px;font-size:12px;color:var(--warn)}
.toast-wrap{position:fixed;top:62px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;background:rgba(245,69,92,.94);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45);font-size:13px;animation:ti .2s}
.toast.down-toast{background:rgba(34,197,94,.94)}
.toast.info{background:rgba(59,130,246,.95)}
@keyframes ti{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.mobile-nav{display:none}
@media (max-width:980px){
  .topbar{gap:6px;padding:8px}
  .brand{font-size:14px;width:100%}
  .spacer{display:none}
  .top-actions{width:100%;overflow-x:auto;flex-wrap:nowrap;padding:2px 0 6px}
  .pulsebar{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 8px 0}
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(310px,58vh) auto;overflow-y:auto;padding:8px;gap:8px}
  .main .panel:first-child{max-height:52vh}

 ['603650','彤程新材','光刻胶'],['300655','晶瑞电材','光刻胶'],['300346','南大光电','光刻胶'],['300576','容大感光','光刻胶'],

 ['603986','兆易创新','存储'],['300223','北京君正','存储'],['301308','江波龙','存储'],['688525','佰维存储','存储'],['001309','德明利','存储'],['688766','普冉股份','存储'],['688110','东芯股份','存储']
];

const INDEX_DEFS=[

const OVERSEAS_DEFS=[
 {code:'usIXIC',secid:'100.NDX',name:'纳斯达克'},

];
const DEFAULT_WATCH=STOCKS.map(s=>s.code);

/* ============ 2. 工具 ============ */
const $=id=>document.getElementById(id);
const f2=n=>Number.isFinite(+n)?(+n).toFixed(2):'--';
const fPct=n=>(n>=0?'+':'')+(+n).toFixed(2)+'%';
const fVol=v=>!Number.isFinite(+v)?'--':(Math.abs(v)>=1e8?(v/1e8).toFixed(2)+'亿手':Math.abs(v)>=1e4?(v/1e4).toFixed(1)+'万手':(+v).toFixed(0)+'手');
const fAmt=v=>{if(!Number.isFinite(+v))return'--';const s=v<0?'-':'',a=Math.abs(v);return s+(a>=1e8?(a/1e8).toFixed(2)+'亿':a>=1e4?(a/1e4).toFixed(0)+'万':a.toFixed(0));};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad2=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const nowTime=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0)||12345;}
function seedRand(seed){let s=seed>>>0;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function codeSeed(c){let h=7;for(let i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))%1000000;return h||123;}
const isIndex=c=>typeof c==='string'&&c.indexOf('IDX_')===0;
const isOverseas=c=>OVERSEAS_DEFS.some(o=>o.code===c);
const isAShare=c=>/^\d{6}$/.test(c);
const isExternal=c=>!isAShare(c);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============ 3. 存储 ============ */
function loadJSON(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v;}catch(e){return def;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ============ 4. 数据源层 ============ */
const JSONP_TIMEOUT=8000;
let jsonpSeq=0;
function jsonp(url,timeout=JSONP_TIMEOUT){
  return new Promise((resolve,reject)=>{
    const cb='__jpcb_'+(++jsonpSeq)+'_'+Date.now().toString(36);
    const s=document.createElement('script');
    let settled=false;
    const timer=setTimeout(()=>finish(new Error('timeout')),timeout);
    function finish(err,data){
      if(settled)return;settled=true;clearTimeout(timer);
      try{delete window[cb];}catch(e){window[cb]=undefined;}
      try{s.remove();}catch(e){}
      err?reject(err):resolve(data);
    }
    window[cb]=d=>finish(null,d);
    s.onerror=()=>finish(new Error('network'));
    s.src=url+(url.includes('?')?'&':'?')+'cb='+cb;
    document.head.appendChild(s);
  });
}
const IDX_SECID={};INDEX_DEFS.forEach(i=>IDX_SECID[i.code]=i.secid);
const OVS_SECID={};OVERSEAS_DEFS.forEach(o=>OVS_SECID[o.code]=o.secid);
function toSecid(code){
  if(IDX_SECID[code])return IDX_SECID[code];
  if(OVS_SECID[code])return OVS_SECID[code];
  if(isAShare(code))return (/^[69]/.test(code)?'1.':'0.')+code;
  return null;
}
const EM_FIELDS='f2,f3,f4,f5,f6,f8,f10,f12,f14,f15,f16,f17,f18,f62,f184';
const EastMoney={
  async fetchQuotes(codes){
    const secids=codes.map(toSecid).filter(Boolean).join(',');
    if(!secids)return{};
    const url='https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&invt=2&fields='+EM_FIELDS+'&secids='+secids;
    const r=await jsonp(url);
    const list=(r&&r.data&&r.data.diff)||[];
    const out={};
    list.forEach(d=>{
      const code=String(d.f12||'').padStart(6,'0');
      if(!code||code==='000000')return;
      out[code]={price:+d.f2,chgPct:+d.f3,chgAmt:+d.f4,vol:+d.f5,amt:+d.f6,turnover:+d.f8,volRatio:+d.f10,
        high:+d.f15,low:+d.f16,open:+d.f17,prevClose:+d.f18,mainInflow:+d.f62,mainRatio:+d.f184,name:d.f14};
    });
    return out;
  },
  async fetchTrends(code){
    const sid=toSecid(code);if(!sid)return null;
    const url='https://push2his.eastmoney.com/api/qt/stock/trends2/get?secid='+sid+'&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f52,f53,f54,f55,f56,f57,f58&iscr=0&ndays=1';
    const r=await jsonp(url);
    const d=r&&r.data;
    if(!d||!Array.isArray(d.trends)||!d.trends.length)return null;
    const pts=[],avgs=[],prev=+d.preClose||+d.prePrice;
    d.trends.forEach(row=>{
      const parts=String(row).split(',');
      if(parts.length<3)return;
      const price=parseFloat(parts[2]);if(!Number.isFinite(price))return;
      pts.push(price);
      if(parts.length>=8){const av=parseFloat(parts[7]);avgs.push(Number.isFinite(av)?av:price);}
    });
    return{pts,avgs,prevClose:prev,name:d.name};
  },
  async fetchKline(code){
    const sid=toSecid(code);if(!sid)return null;
    const url='https://push2his.eastmoney.com/api/qt/stock/kline/get?secid='+sid+'&klt=101&fqt=1&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&end=20500101&lmt=180';
    const r=await jsonp(url);
    const d=r&&r.data;
    if(!d||!Array.isArray(d.klines)||!d.klines.length)return null;
    const bars=[];
    d.klines.forEach(row=>{
      const p=String(row).split(',');
      if(p.length<6)return;
      const o=+p[1],c=+p[2],h=+p[3],l=+p[4],v=+p[5];
      if(![o,c,h,l,v].every(Number.isFinite))return;
      bars.push({o,c,h,l,v,date:p[0]});
    });
    return bars.length?{bars,name:d.name}:null;
  }
};
const Tencent={
  sym(code){return isAShare(code)?((/^[69]/.test(code)?'sh':'sz')+code):null;},
  async fetchQuotes(codes){
    const syms=codes.map(c=>this.sym(c)).filter(Boolean);
    if(!syms.length)return{};
    return new Promise(resolve=>{
      const varNames=syms.map(s=>'v_'+s);
      const s=document.createElement('script');s.charset='GBK';
      const timer=setTimeout(()=>{cleanup();resolve({});},7000);
      function cleanup(){clearTimeout(timer);try{s.remove();}catch(e){}}
      s.onload=()=>{
        cleanup();const out={};
        syms.forEach((sym,i)=>{
          const raw=window[varNames[i]];if(typeof raw!=='string')return;
          const p=raw.split('~');if(p.length<40)return;
          const code=sym.slice(2);
          out[code]={price:+p[3],chgAmt:+p[31],chgPct:+p[32],open:+p[5],prevClose:+p[4],high:+p[33],low:+p[34],
            vol:+p[36],amt:(+p[37])*1e4,turnover:+p[38],name:p[1],volRatio:NaN,mainInflow:NaN,mainRatio:NaN};
          try{delete window[varNames[i]];}catch(e){}
        });
        resolve(out);
      };
      s.onerror=()=>{cleanup();resolve({});};
      s.src='https://qt.gtimg.cn/q='+syms.join(',');
      document.head.appendChild(s);
    });
  }
};
const Sim={
  seedOf(code){return isAShare(code)?(20+hashStr(code)%300):(1000+hashStr(code)%3000);},
  makeQuote(code,name){
    const rnd=seedRand(codeSeed(code));
    const base=this.seedOf(code);
    const prevClose=base*(1+(rnd()-0.5)*0.04);
    const price=prevClose*(1+(rnd()-0.5)*0.05);
    const open=prevClose*(1+(rnd()-0.5)*0.02);
    const high=Math.max(open,price)*(1+rnd()*0.01);
    const low=Math.min(open,price)*(1-rnd()*0.01);
    const vol=Math.round(base*40000*(0.6+rnd()));
    return{price,prevClose,open,high,low,vol,amt:vol*price*100,
      chgPct:(price-prevClose)/prevClose*100,chgAmt:price-prevClose,
      mainInflow:(rnd()-0.45)*base*9000,mainRatio:(rnd()-0.45)*16,
      turnover:0.5+rnd()*8,volRatio:0.8+rnd()*2,name:name||code,sim:true};
  },
  tick(q,base){
    const r=(Math.random()-0.5)*0.006;
    const np=Math.max(0.2,Math.round(q.price*(1+r)*100)/100);
    q.price=np;q.high=Math.max(q.high,np);q.low=Math.min(q.low,np);
    q.vol+=Math.round(Math.random()*base*400);q.amt=q.vol*np*100;
    q.chgPct=(np-q.prevClose)/q.prevClose*100;q.chgAmt=np-q.prevClose;
    q.mainInflow+=(Math.random()-0.48)*base*260;
    q.mainRatio=clamp((q.mainRatio||0)+(Math.random()-0.5)*0.8,-24,24);
  },
  buildDaily(code){
    const rnd=seedRand(codeSeed(code));const base=this.seedOf(code);
    const bars=[];let p=base*0.7;
    for(let i=0;i<180;i++){
      const o=p,c=Math.max(.2,p*(1+(rnd()-.47)*.05));
      bars.push({o,c,h:Math.max(o,c)*(1+rnd()*.013),l:Math.min(o,c)*(1-rnd()*.013),v:Math.round((0.6+rnd()*1.3)*base*40000)});
      p=c;
    }
    return bars;
  },
  buildMinute(prev,cur){
    const rnd=seedRand(codeSeed('m'+prev+cur));
    const N=240,pts=[];let p=prev;
    for(let i=0;i<N;i++){p+=(cur-p)/Math.max(1,N-i)+(rnd()-.5)*prev*.0024;pts.push(p);}
    pts[N-1]=cur;return pts;
  }
};

function beep(severe){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.frequency.value=severe?920:620;o.type='sine';
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.38);
    o.start();o.stop(audioCtx.currentTime+.42);
  }catch(e){}
}

/* ============ 7. 雷达 + 价格提醒 ============ */
const ICON={speed:'⚡',price:'🚀',volume:'📊',fund:'💰',limit:'🔴',alert:'🔔'};
const eventUp=ev=>!/(跌|出逃|下杀|下破)/.test(ev.title);
function pushEvent(code,type,title,text,severe){
  const q=quotes[code];if(!q)return;
  const now=Date.now();
  const cdMap={volume:1500,fund:900,limit:800,speed:650,price:650,alert:0};
  q.cooldown=q.cooldown||{};
  if(cdMap[type]&&q.cooldown[type]&&now-q.cooldown[type]<cdMap[type])return;
  if(cdMap[type])q.cooldown[type]=now;
  const name=(metas[code]&&metas[code].name)||q.name||code;
  const ev={name,code,type,title,text,t:nowTime(),sev:!!severe};
  events.unshift(ev);if(events.length>80)events.pop();
  beep(severe&&eventUp(ev));
  notify('科技雷达 · '+name,text);
  if(alertTab==='events')renderRadar();
}
function scanRadar(){
  const t=Date.now();
  const scope=radarCfg.scope==='all'
    ? Array.from(new Set(watchlist.concat(STOCKS.map(s=>s.code))))
    : watchlist;
  scope.forEach(code=>{
    const q=quotes[code];if(!q)return;
    q.history=q.history||[];
    q.history.push({t,p:q.price});
    while(q.history.length>1&&q.history[0].t<t-650000)q.history.shift();
    let ref=null;
    for(let i=0;i<q.history.length;i++){if(t-q.history[i].t>=55000)ref=q.history[i];else break;}
    if(radarCfg.speed&&ref){
      const m=(q.price-ref.p)/ref.p;
      if(Math.abs(m)>=radarCfg.speedTh/100)
        pushEvent(code,'speed',m>=0?'急拉':'急跌','1分钟涨速 '+(m*100).toFixed(2)+'%',Math.abs(m)>=radarCfg.speedSev/100);
    }
    if(radarCfg.limit&&isAShare(code)){
      const pc=q.chgPct!=null?q.chgPct:(q.price-q.prevClose)/q.prevClose*100;
      const lim=/^[3]/.test(code)||/^688/.test(code)?20:10;
      if(pc>=lim-radarCfg.limitDist)pushEvent(code,'limit','冲击涨停','涨幅 '+pc.toFixed(2)+'%，逼近涨停价',true);
      if(pc<=-(lim-radarCfg.limitDist))pushEvent(code,'limit','逼近跌停','跌幅 '+pc.toFixed(2)+'%，注意风险',true);
    }
    if(radarCfg.price&&q.anchor){
      const move=(q.price-q.anchor)/q.anchor;
      const resetTh=Math.max(0.003,radarCfg.priceTh/100*0.35);
      if(!q.alerted&&Math.abs(move)>=radarCfg.priceTh/100){
        q.alerted=true;
        pushEvent(code,'price',move>=0?'急拉':'急跌','快照内'+(move>=0?'拉升':'跳水')+' '+(move*100).toFixed(2)+'%',true);
      }
      if(Math.abs(move)<resetTh)q.alerted=false;
    }
    if(radarCfg.volume&&Number.isFinite(q.volRatio)&&isAShare(code)&&q.volRatio>=radarCfg.volumeTh){
      pushEvent(code,'volume',(q.chgPct||0)>=0?'放量上攻':'放量下杀','量比 '+q.volRatio.toFixed(1)+' · '+fPct(q.chgPct||0),q.volRatio>=radarCfg.volumeSev);
    }
    if(radarCfg.fund&&Number.isFinite(q.mainRatio)&&isAShare(code)){
      if(q.mainRatio>=radarCfg.fundTh)pushEvent(code,'fund','主力抢筹','主力净占比 '+q.mainRatio.toFixed(1)+'% · 净流入 '+fAmt(q.mainInflow),true);
      if(q.mainRatio<=-radarCfg.fundTh)pushEvent(code,'fund','主力出逃','主力净占比 '+q.mainRatio.toFixed(1)+'% · 净流出 '+fAmt(-q.mainInflow),true);
    }
  });
  // 价格提醒：和雷达独立，走自己的冷却（无）
  let changed=false;
  priceAlerts.forEach(a=>{
    if(a.triggered)return;
    const q=quotes[a.code];if(!q)return;
    const hit=(a.dir==='above'&&q.price>=a.price)||(a.dir==='below'&&q.price<=a.price);
    if(hit){
      a.triggered=true;a.triggeredAt=Date.now();a.triggeredPrice=q.price;
      changed=true;
      const nm=(metas[a.code]&&metas[a.code].name)||q.name||a.code;
      pushEvent(a.code,'alert',a.dir==='above'?'上破提醒':'下破提醒',
        nm+' 现价 '+f2(q.price)+'，'+(a.dir==='above'?'已上破 ':'已下破 ')+f2(a.price)+(a.note?'（'+a.note+'）':''),true);
    }
  });
  if(changed){saveJSON('kr_alerts_v1',priceAlerts);if(alertTab==='alerts')renderAlertPane();renderStockList();updateAlertBadge();}
}

      +'<span>'+(a.triggered?'✅ 已触发 '+(a.triggeredPrice?f2(a.triggeredPrice):''):(Number.isFinite(dist)?('距目标 '+(dist>0?'+':'')+dist.toFixed(2)+'%'):''))+'</span></div>'

      +'</div>';

/* ============ 8. 行情刷新 ============ */
function applyQuote(code,d){
  const q=ensureQuote(code);
  q.price=d.price;q.prevClose=d.prevClose||q.prevClose;
  q.open=Number.isFinite(d.open)?d.open:q.open;
  q.high=Number.isFinite(d.high)?d.high:q.high;
  q.low=Number.isFinite(d.low)?d.low:q.low;
  q.vol=d.vol;q.amt=d.amt;
  q.chgPct=d.chgPct;q.chgAmt=d.chgAmt;
  q.turnover=d.turnover;q.volRatio=d.volRatio;
  q.mainInflow=d.mainInflow;q.mainRatio=d.mainRatio;
  q.name=d.name||q.name;q.sim=!!d.sim;q.ts=Date.now();
}
async function refreshQuotes(){
  if(refreshInFlight)return;
  refreshInFlight=true;
  const codes=Array.from(new Set(watchlist.concat(INDEX_DEFS.map(i=>i.code)).concat(OVERSEAS_DEFS.map(o=>o.code))));
  const r=await DataHub.fetchQuotes(codes);
  if(r.ok){
    Object.keys(r.data).forEach(code=>applyQuote(code,r.data[code]));
    // secid 别名对齐
    INDEX_DEFS.forEach(i=>{const d=r.data[i.secid];if(d)applyQuote(i.code,d);});
    OVERSEAS_DEFS.forEach(o=>{const d=r.data[o.secid];if(d)applyQuote(o.code,d);});
  }
  refreshInFlight=false;
}
function simTick(){
  if(DataHub.health!=='sim')return;

    const q=quotes[code];if(!q)return;
    Sim.tick(q,Sim.seedOf(code));
    if(q.minute&&q.minute.length)q.minute[q.minute.length-1]=q.price;
  });
}

async function ensureTrends(code){
  const c=minuteCache[code];
  if(c&&Date.now()-c.ts<CACHE_TTL)return c;
  const d=await DataHub.fetchTrends(code);
  if(d&&d.pts.length){minuteCache[code]={...d,ts:Date.now()};return minuteCache[code];}
  const q=ensureQuote(code);
  const pts=Sim.buildMinute(q.prevClose,q.price);
  minuteCache[code]={pts,avgs:null,prevClose:q.prevClose,ts:Date.now(),sim:true};
  return minuteCache[code];
}
async function ensureKline(code){
  const c=klineCache[code];
  if(c&&Date.now()-c.ts<CACHE_TTL*2)return c;
  const d=await DataHub.fetchKline(code);
  if(d&&d.bars.length){klineCache[code]={...d,ts:Date.now()};return klineCache[code];}
  klineCache[code]={bars:Sim.buildDaily(code),ts:Date.now(),sim:true};
  return klineCache[code];
}

/* ============ 11. 图表 ============ */
const canvas=$('chart'),ctx=canvas.getContext('2d');
function fitCanvas(){
  const dpr=window.devicePixelRatio||1;
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return r;
}
let chartRaf=0;
function drawChart(){
  if(chartRaf)cancelAnimationFrame(chartRaf);
  chartRaf=requestAnimationFrame(()=>{
    chartRaf=0;
    const r=fitCanvas(),W=r.width,H=r.height;
    ctx.clearRect(0,0,W,H);
    if(!selectedCode||W<40||H<40)return;
    if(chartMode==='min')drawMin(W,H);else drawK(W,H);
  });
}
function drawGrid(W,padR,padT,ch,mx,rng){
  ctx.strokeStyle='#2a313c';ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){
    const yy=padT+ch*i/4;
    ctx.beginPath();ctx.moveTo(8,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
    ctx.fillText((mx-rng*i/4).toFixed(2),W-padR+4,yy);
  }
}
async function drawMin(W,H){
  const code=selectedCode;
  const q=quotes[code];if(!q)return;
  const data=await ensureTrends(code);
  const pts=data.pts;if(!pts||pts.length<2)return;
  const prev=data.prevClose||q.prevClose;
  const padL=8,padR=64,padT=18,padB=22,cw=W-padL-padR,ch=H-padT-padB;
  const vals=pts.concat([prev]);
  const mx=Math.max(...vals),mn=Math.min(...vals),rng=mx-mn||1;
  const y=v=>padT+(mx-v)/rng*ch,x=i=>padL+i/(pts.length-1)*cw;
  drawGrid(W,padR,padT,ch,mx,rng);
  ctx.setLineDash([4,3]);ctx.strokeStyle='#8b949e';
  ctx.beginPath();ctx.moveTo(padL,y(prev));ctx.lineTo(W-padR,y(prev));ctx.stroke();ctx.setLineDash([]);
  if(showAvgLine){
    let avgPts=data.avgs;
    if(!avgPts||avgPts.length!==pts.length){
      avgPts=[];let sum=0;pts.forEach((v,i)=>{sum+=v;avgPts.push(sum/(i+1));});
    }
    ctx.strokeStyle='#e6b800';ctx.lineWidth=1;ctx.beginPath();
    avgPts.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
    ctx.stroke();
  }
  const up=q.price>=prev,col=up?'#f5455c':'#22c55e';
  ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.stroke();
  ctx.lineTo(x(pts.length-1),padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();
  ctx.fillStyle=up?'rgba(245,69,92,.12)':'rgba(34,197,94,.12)';ctx.fill();
  ctx.fillStyle='#8b949e';
  const labels=(isExternal(code)&&!isIndex(code))?['开盘','','盘中','','收盘']:['09:30','10:30','11:30','14:00','15:00'];
  labels.forEach((t,i)=>{ctx.fillText(t,padL+cw*i/4-(t.length>2?14:12),H-7);});
  ctx.fillStyle=col;ctx.fillRect(W-padR,y(q.price)-8,padR,16);
  ctx.fillStyle='#fff';ctx.fillText(q.price.toFixed(2),W-padR+4,y(q.price));
  let legendX=padL+4;
  if(showAvgLine){ctx.fillStyle='#e6b800';ctx.fillText('— 均价',legendX,8);legendX+=50;}
  ctx.fillStyle=col;ctx.fillText('— 价格',legendX,8);legendX+=50;
  if(data.sim){ctx.fillStyle='#f59e0b';ctx.fillText('模拟分时',legendX,8);}
}
function ma(n,bars,i){if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=bars[j].c;return s/n;}
function calcEMA(arr,n){
  if(!arr.length)return[];
  const k=2/(n+1),out=[arr[0]];let prev=arr[0];
  for(let i=1;i<arr.length;i++){prev=arr[i]*k+prev*(1-k);out.push(prev);}
  return out;
}
function calcMACD(closes){
  const e12=calcEMA(closes,12),e26=calcEMA(closes,26);
  const dif=e12.map((v,i)=>v-e26[i]);
  const dea=calcEMA(dif,9);
  const macd=dif.map((v,i)=>(v-dea[i])*2);
  return{dif,dea,macd};
}
async function drawK(W,H){
  const code=selectedCode;
  const q=quotes[code];if(!q)return;
  const data=await ensureKline(code);
  const bars=data.bars;if(!bars||bars.length<5)return;
  const padL=8,padR=64,padT=18,padB=32;
  const cw=W-padL-padR,allH=H-padT-padB;
  const show=W<650?90:140,list=bars.slice(-show);
  const mx=Math.max(...list.map(b=>b.h)),mn=Math.min(...list.map(b=>b.l)),rng=mx-mn||1;
  const maxV=Math.max(...list.map(b=>b.v))||1;
  let priceH,volH,macdTop=0,macdH=0;
  if(kIndicator==='macd'){priceH=allH*.58;volH=allH*.14;macdH=allH*.28;macdTop=padT+priceH+volH;}
  else{priceH=allH*.72;volH=allH*.28;}
  const y=v=>padT+(mx-v)/rng*priceH,bw=cw/show*.7,bx=i=>padL+cw*(i+.5)/show;
  drawGrid(W,padR,padT,priceH,mx,rng);
  // 成交量
  list.forEach((b,i)=>{
    ctx.fillStyle=b.c>=b.o?'rgba(245,69,92,.55)':'rgba(34,197,94,.55)';
    ctx.fillRect(bx(i)-bw/2,padT+priceH+volH-b.v/maxV*volH,bw,b.v/maxV*volH);
  });
  // 价格 K 线
  list.forEach((b,i)=>{
    const col=b.c>=b.o?'#f5455c':'#22c55e';
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx(i),y(b.h));ctx.lineTo(bx(i),y(b.l));ctx.stroke();
    ctx.fillRect(bx(i)-bw/2,y(Math.max(b.o,b.c)),bw,Math.max(1,Math.abs(y(b.o)-y(b.c))));
  });
  if(kIndicator==='ma'){
    [[5,'#e6b800'],[10,'#3b82f6'],[20,'#a78bfa']].forEach(([n,col])=>{
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();let started=false;
      list.forEach((_,i)=>{
        const real=bars.length-show+i,v=ma(n,bars,real);if(v==null)return;
        started?ctx.lineTo(bx(i),y(v)):ctx.moveTo(bx(i),y(v));started=true;
      });
      ctx.stroke();ctx.fillStyle=col;ctx.fillText('MA'+n,padL+(n===5?4:n===10?52:100),7);
    });
  }
  // MACD 副图
  if(kIndicator==='macd'){
    const allCloses=bars.map(b=>b.c);
    const {dif,dea,macd}=calcMACD(allCloses);
    const off=bars.length-show;
    const difV=dif.slice(off),deaV=dea.slice(off),macdV=macd.slice(off);
    let vmax=0;
    [...difV,...deaV,...macdV].forEach(v=>{if(Number.isFinite(v))vmax=Math.max(vmax,Math.abs(v));});
    if(vmax===0)vmax=1;
    const yM=v=>macdTop+macdH/2-(v/vmax)*(macdH/2-3);
    // 中轴
    ctx.strokeStyle='#2a313c';ctx.beginPath();
    ctx.moveTo(padL,macdTop+macdH/2);ctx.lineTo(W-padR,macdTop+macdH/2);ctx.stroke();
    // 柱
    list.forEach((_,i)=>{
      const v=macdV[i];if(!Number.isFinite(v))return;
      const col=v>=0?'rgba(245,69,92,.65)':'rgba(34,197,94,.65)';
      ctx.fillStyle=col;
      const y0=macdTop+macdH/2, y1=yM(v);
      ctx.fillRect(bx(i)-bw/2,Math.min(y0,y1),bw,Math.max(1,Math.abs(y1-y0)));
    });
    // DIF / DEA 线
    ctx.lineWidth=1;
    ctx.strokeStyle='#e6b800';ctx.beginPath();
    difV.forEach((v,i)=>{if(!Number.isFinite(v))return;i?ctx.lineTo(bx(i),yM(v)):ctx.moveTo(bx(i),yM(v));});
    ctx.stroke();
    ctx.strokeStyle='#3b82f6';ctx.beginPath();
    deaV.forEach((v,i)=>{if(!Number.isFinite(v))return;i?ctx.lineTo(bx(i),yM(v)):ctx.moveTo(bx(i),yM(v));});
    ctx.stroke();
    ctx.fillStyle='#e6b800';ctx.fillText('DIF',padL+4,macdTop+9);
    ctx.fillStyle='#3b82f6';ctx.fillText('DEA',padL+34,macdTop+9);
  }
  // 日期
  ctx.fillStyle='#8b949e';
  [0,Math.round(show*.25),Math.round(show*.5),Math.round(show*.75),show-1].forEach(i=>{
    const b=list[i];if(!b)return;
    let label='';
    if(b.date){const p=b.date.split('-');label=p[1]+'/'+p[2];}
    else{const d=new Date();d.setDate(d.getDate()-(show-1-i));label=(d.getMonth()+1)+'/'+d.getDate();}
    ctx.fillText(label,bx(i)-14,H-12);
  });
  if(data.sim){ctx.fillStyle='#f59e0b';ctx.fillText('模拟K线',padL+4,priceH+8);}
}

function localAICommentary(arr,heat,byPct,byFund){
  if(!arr.length)return '当前自选池为空，请先在盯盘页添加标的。';
  const upN=arr.filter(x=>(x.q.chgPct||0)>.05).length,dnN=arr.filter(x=>(x.q.chgPct||0)<-.05).length;
  const avg=arr.reduce((a,x)=>a+(x.q.chgPct||0),0)/arr.length;
  const strongest=heat[0],weakest=heat[heat.length-1];
  const fundIn=byFund[0],fundOut=byFund[byFund.length-1];
  const lead=byPct[0],lag=byPct[byPct.length-1];
  const tone=avg>.5?'自选池整体偏强，情绪偏向进攻。':avg<-.5?'自选池整体承压，注意控制回撤。':'震荡分化，个股更看资金与业绩确定性。';
  const lines=[tone];
  lines.push('池内共 '+arr.length+' 只，上涨 '+upN+' 只、下跌 '+dnN+' 只，平均涨跌幅 '+fPct(avg)+'。');
  if(strongest)lines.push('板块方面，「'+strongest.sec+'」平均 '+fPct(strongest.avg)+(weakest&&weakest!==strongest?'，弱于「'+weakest.sec+'」'+fPct(weakest.avg):'')+'。');
  if(lead&&lag)lines.push('弹性标的：'+lead.s.name+' '+fPct(lead.q.chgPct||0)+'；相对弱：'+lag.s.name+' '+fPct(lag.q.chgPct||0)+'。');
  if(fundIn&&fundOut&&Number.isFinite(fundIn.q.mainInflow))lines.push('资金：'+fundIn.s.name+' 净流入 '+fAmt(fundIn.q.mainInflow)+'，'+fundOut.s.name+' 净流出 '+fAmt(-fundOut.q.mainInflow)+'。');
  lines.push('数据来源：'+(DataHub.health==='live'?'东方财富实时接口':DataHub.health==='degraded'?'腾讯财经备用接口（部分字段缺失）':'本地模拟兜底')+'。');
  lines.push('以上由本地规则自动生成，不构成投资建议。');
  return lines.join('\n');
}
function rankRows(rows,fn,fmt){

      +'<span class="nm">'+x.s.name+'<span class="cd">'+x.s.code+'</span></span>'
      +'<span class="v '+(v>=0?'up':'down')+'">'+fmt(v)+'</span></div>';

function linkify(root){
  if(!root)return;
  const names=STOCKS.map(s=>({code:s.code,name:s.name})).sort((a,b)=>b.name.length-a.name.length);
  const pattern=new RegExp(names.map(x=>x.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      if(!node.nodeValue||!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;
      const p=node.parentElement;
      if(!p||p.closest('.quote-link,button,script,style,[data-code]'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[];let n;
  while((n=walker.nextNode()))nodes.push(n);
  nodes.forEach(tn=>{
    const text=tn.nodeValue;pattern.lastIndex=0;
    let m,last=0;const frag=document.createDocumentFragment();
    while((m=pattern.exec(text))){
      const item=names.find(x=>x.name===m[0]);if(!item)continue;
      if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      const span=document.createElement('span');
      span.className='quote-link';span.dataset.code=item.code;span.tabIndex=0;span.textContent=m[0];
      frag.appendChild(span);last=m.index+m[0].length;
    }
    if(last>0){if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));tn.replaceWith(frag);}
  });
}
function renderReview(){
  const arr=watchlist.filter(c=>isAShare(c)).map(c=>({s:{code:c,name:(metas[c]||{}).name||c,sector:(metas[c]||{}).sector||'其他'},q:quotes[c]||ensureQuote(c)}));
  const byPct=arr.slice().sort((a,b)=>(b.q.chgPct||0)-(a.q.chgPct||0));
  const byVol=arr.slice().sort((a,b)=>b.q.vol-a.q.vol);
  const byFund=arr.slice().sort((a,b)=>(b.q.mainInflow||0)-(a.q.mainInflow||0));
  const heat=SECTORS.map(sec=>{
    const list=arr.filter(x=>x.s.sector===sec);
    return list.length?{sec,avg:list.reduce((a,x)=>a+(x.q.chgPct||0),0)/list.length,n:list.length}:null;
  }).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  const heatMax=Math.max(1,...heat.map(h=>Math.abs(h.avg)));
  const ai=localAICommentary(arr,heat,byPct,byFund);

function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},150);
}
