<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>科技股雷达 · 盯盘复盘工具</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --border:#2a313c;
  --text:#e6edf3; --muted:#8b949e; --up:#f5455c; --down:#22c55e; --accent:#3b82f6;
  --warn:#f59e0b; --purple:#a78bfa; --card:#161b22;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg)}
body{
  font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;
}
button,input{font:inherit}
[hidden]{display:none!important}
#app{height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.up{color:var(--up)!important}.down{color:var(--down)!important}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-size:16px;font-weight:700;white-space:nowrap;margin-right:4px}
.brand .logo{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel2);color:var(--text)}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top-actions .btn{flex-shrink:0}
.spacer{flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.status{padding:3px 10px;border-radius:12px;font-size:12px;white-space:nowrap}
.status.open{background:rgba(245,69,92,.15);color:var(--up)}
.status.closed{background:rgba(139,148,158,.15);color:var(--muted)}
.btn{padding:6px 11px;border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55)}
.btn.danger{background:rgba(245,69,92,.14);border-color:rgba(245,69,92,.45)}
.mini-btn{padding:2px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--muted);cursor:pointer;font-size:11px}
.mini-btn:hover{border-color:var(--accent);color:var(--text)}
.idxbar{display:flex;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.idx{display:flex;align-items:baseline;gap:8px;padding:5px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:border-color .15s,background .15s}
.idx:hover{border-color:var(--accent);background:rgba(59,130,246,.10)}
.idx:focus-visible,.quote-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.idx .nm{color:var(--muted);font-size:12px}.idx .px{font-weight:700;font-variant-numeric:tabular-nums}
.idx .pc{font-size:12px;font-variant-numeric:tabular-nums}

.pulsebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px 14px 0}
.pulse-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px;min-width:0;position:relative;overflow:hidden}
.pulse-card::after{content:"";position:absolute;right:-22px;top:-22px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.22),transparent 70%)}
.pulse-card .k{color:var(--muted);font-size:11px;margin-bottom:6px}
.pulse-card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse-card .sub{color:var(--muted);font-size:11px;margin-top:5px;line-height:1.4}
.pulse-card.hot{border-color:rgba(245,69,92,.45);background:linear-gradient(145deg,rgba(245,69,92,.12),var(--panel))}
.pulse-card.blue{border-color:rgba(59,130,246,.4);background:linear-gradient(145deg,rgba(59,130,246,.12),var(--panel))}

.main{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr) 306px;gap:10px;padding:10px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:9px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h3{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.panel h3 .cnt{color:var(--muted);font-weight:400;font-size:11px}
.sectors{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;border-bottom:1px solid var(--border);max-height:190px;flex-shrink:0}
.sec{padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sec:hover{background:var(--panel2);color:var(--text)}
.sec.active{background:var(--accent);color:#fff}
.sec .c{font-size:11px;opacity:.8}
.searchbox{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.searchbox label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.searchbox input{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.search-hint{display:none;margin-top:6px;font-size:11px;color:var(--warn);line-height:1.5}
.search-hint.show{display:block}
.search-hint.info{color:#93c5fd}
.search-result{position:absolute;top:46px;left:8px;right:8px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;z-index:30;max-height:220px;overflow-y:auto;display:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.search-result.show{display:block}
.sr-item{padding:9px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.sr-item:hover{background:var(--accent)}
.sr-item .muted{opacity:.65}
.manage-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}
.manage-bar .spacer{flex:1}
.manage-bar .pick-all{display:flex;align-items:center;gap:5px;color:var(--muted)}
.stocklist{flex:1;overflow-y:auto}
.stk{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.stk:hover{background:var(--panel2)}
.stk.sel{background:var(--panel2);border-left:2px solid var(--accent);padding-left:10px}
.stk .pick{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.stk .info{flex:1;min-width:0}
.stk .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .cd{color:var(--muted);font-size:11px}
.stk .rt{text-align:right;flex-shrink:0}
.stk .px,.stk .pc{font-variant-numeric:tabular-nums}.stk .px{font-size:12px}.stk .pc{font-size:11px}
.stk .del{color:var(--muted);background:none;border:none;cursor:pointer;font-size:16px;flex-shrink:0;opacity:0;line-height:1;padding:2px}
.stk:hover .del{opacity:1}.stk .del:hover{color:var(--up)}
body.manage-mode .stk .del{opacity:1}
.detail-head{padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.dh-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.dh-name{font-size:18px;font-weight:700}.dh-code{color:var(--muted)}
.tag{padding:2px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--muted)}
.dh-price{display:flex;align-items:baseline;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.dh-price .px{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.dh-price .chg{font-size:14px;font-variant-numeric:tabular-nums}
.dh-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 16px}
.dh-stat{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.dh-stat .l{color:var(--muted)}.dh-stat .v{font-variant-numeric:tabular-nums}
.chart-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.chart-tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.chart-tab{padding:5px 14px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:12px}
.chart-tab:hover{color:var(--text)}
.chart-tab.active{background:var(--panel2);color:var(--text)}
canvas{flex:1;width:100%;min-height:0;display:block}
.alert-list{flex:1;overflow-y:auto}
.alert-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.alert-item:hover{background:var(--panel2)}
.alert-item.severe{border-left:3px solid var(--up)}
.alert-item.severe.down-event{border-left-color:var(--down)}
.alert-item .at{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.alert-item .t{color:var(--muted);font-size:11px;flex-shrink:0}
.alert-item .d{color:var(--muted);word-break:break-all}
.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}
.review{flex:1;overflow-y:auto;padding:16px;display:none;background:var(--bg)}
.review.show{display:block}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.rv-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;min-width:0}
.rv-card.wide{grid-column:1/-1}
.rv-card h4{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--panel2)}
.rank-row .no{width:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .cd{color:var(--muted);font-size:11px;margin-left:4px}
.rank-row .v{font-variant-numeric:tabular-nums;font-weight:600}
.heat-row{padding:9px 14px;border-bottom:1px solid var(--border)}
.heat-row:last-child{border-bottom:none}
.heat-row .ht{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;gap:10px}
.heat-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.heat-fill{height:100%;border-radius:3px;transition:width .4s}
.ov-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.ov-item:last-of-type{border-bottom:none}
.ov-item:hover{background:var(--panel2)}
.ov-item .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.disc{margin:10px 14px 14px;padding:10px 12px;background:var(--panel2);border-radius:7px;color:var(--muted);font-size:11px;line-height:1.8}
.disc:last-child{margin:0}
.ai-box{padding:14px;line-height:1.9;font-size:13px}
.ai-summary{white-space:pre-wrap;color:var(--text)}
.ai-summary b{font-weight:700}
.quote-link{color:#93c5fd;cursor:pointer;border-bottom:1px dashed rgba(147,197,253,.45);padding-bottom:1px;text-decoration:none}
.quote-link:hover{color:#fff;border-bottom-color:#fff}
.sentiment-grid{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}
.ann-list{max-height:360px;overflow-y:auto}
.ann-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.ann-item:hover{background:var(--panel2)}
.ann-item:last-child{border-bottom:none}
.ann-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.ann-top time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.ann-tag{padding:1px 7px;border:1px solid rgba(59,130,246,.3);border-radius:4px;background:rgba(59,130,246,.14);color:#93c5fd;font-size:11px}
.ann-title{font-size:12px;line-height:1.7;margin-bottom:3px}
.ann-src{color:var(--muted);font-size:11px;line-height:1.5}
.concept-box{padding:14px;font-size:12px;line-height:1.85;color:var(--muted)}
.concept-box p{margin-bottom:9px}
.concept-box ul{padding-left:18px;margin-bottom:8px}
.concept-box li{margin-bottom:7px}
.concept-box .disc{margin:10px 0 0}
.news-list{max-height:330px;overflow-y:auto}
.news-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.7;display:flex;gap:8px}
.news-item:last-child{border-bottom:none}
.news-item time{color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}

.source-view{flex:1;overflow-y:auto;padding:16px;display:none;background:var(--bg)}
.source-view.show{display:block}
.src-hero{background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(167,139,250,.10));border:1px solid rgba(59,130,246,.35);border-radius:12px;padding:18px;margin-bottom:12px}
.src-hero h2{font-size:18px;margin-bottom:6px}
.src-hero p{color:var(--muted);font-size:12px;line-height:1.75;margin-bottom:10px}
.src-hero .src-status{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4);color:var(--down);font-size:12px;font-weight:600}
.src-hero .src-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:srcPulse 1.6s infinite}
@keyframes srcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
.src-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.src-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-width:0}
.src-card h4{font-size:13px;margin-bottom:10px}
.src-card .src-num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.src-card .src-sub{color:var(--muted);font-size:11px;line-height:1.6;margin-top:4px}
.src-plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.src-step{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.src-step .step-no{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;background:rgba(59,130,246,.18);color:#93c5fd;font-size:12px;font-weight:700;margin-bottom:9px}
.src-step h5{font-size:13px;margin-bottom:6px}
.src-step p{color:var(--muted);font-size:11px;line-height:1.7}
.src-config{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.src-config h4{font-size:13px;margin-bottom:10px}
.interval-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:12px}
.interval-pill input{display:none}
.interval-pill span{display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:var(--panel2);color:var(--muted);font-size:12px;transition:.15s}
.interval-pill input:checked+span{border-color:var(--accent);background:rgba(59,130,246,.16);color:#fff}
.src-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.src-table-wrap{overflow-x:auto}
.src-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}
.src-table th,.src-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.src-table th{color:var(--muted);font-weight:600}
.src-table td:last-child{color:var(--muted)}

.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(760px,96vw);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 22px 70px rgba(0,0,0,.55)}
.modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);background:rgba(22,27,34,.96)}
.modal-head h2{font-size:15px;margin-bottom:4px}
.modal-head p{font-size:11px;line-height:1.5;color:var(--muted)}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.modal-close:hover{color:var(--text)}
.modal-body,.m-panel{padding:16px 18px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel2)}
.modal-foot .spacer{flex:1}
.modal input[type="text"],.modal input[type="number"]{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.modal input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.modal input:disabled{opacity:.55}
.modal input[type="checkbox"],.modal input[type="radio"]{accent-color:var(--accent)}
.form-section{font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 8px}
.radio-line{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfg-row{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel2)}
.cfg-row.disabled{opacity:.62}
.cfg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px}
.cfg-sub{color:var(--muted);font-size:11px}
.cfg-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfg-fields.single{grid-template-columns:1fr}
.cfg-fields label{font-size:11px;color:var(--muted)}
.cfg-fields input{margin-top:4px}
.form-hint{margin-top:7px;font-size:11px;line-height:1.6;color:var(--muted)}
.form-hint.error{color:var(--warn)}
.form-hint.success{color:var(--down)}
.form-hint.info{color:#93c5fd}
.form-error{min-height:18px;margin-top:9px;font-size:12px;line-height:1.5;color:var(--warn)}
.toast-wrap{position:fixed;top:62px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 14px;border-radius:8px;background:rgba(245,69,92,.94);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45);font-size:13px;animation:toastIn .2s ease}
.toast.down-toast{background:rgba(34,197,94,.94)}
.toast.info{background:rgba(59,130,246,.95)}
@keyframes toastIn{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

.mobile-nav{display:none}
@media (max-width:980px){
  #app{height:100dvh}
  .topbar{gap:6px;padding:8px}
  .brand{font-size:14px;width:100%;order:-1}
  .tabs{order:0}
  .spacer{display:none}
  .clock{order:1}.status{order:2}
  .top-actions{order:3;width:100%;display:flex;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;padding:2px 0 6px;scrollbar-width:thin}
  .pulsebar{grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 8px 0}
  .pulse-card .v{font-size:18px}
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(310px,58vh) auto;overflow-y:auto;padding:8px;gap:8px}
  .main .panel{min-height:0}
  .main .panel:first-child{max-height:46vh}
  .sectors{max-height:118px;flex-direction:row;flex-wrap:wrap}
  .sec{width:calc(33.333% - 4px);justify-content:center;font-size:12px}
  .stocklist{max-height:28vh}
  .stk{padding:11px 12px}.stk .del{opacity:.65;font-size:18px;padding:2px 6px}
  .detail-head{padding:10px}
  .dh-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
  .dh-stat{font-size:11px}.dh-price .px{font-size:25px}
  canvas{min-height:250px}
  .alert-list{max-height:34vh}
  .alert-item{padding:12px}
  .review{padding:10px}
  .rv-grid{grid-template-columns:1fr;gap:10px}
  .sentiment-grid{grid-template-columns:1fr!important}
  .source-view{padding:10px}
  .src-hero{padding:14px}

function genDaily(stock,barsCount=180){

  const drift=0.004+rnd()*0.003;
  const r=(rnd()-0.48)*0.052+drift;
  const open=p,close=Math.max(0.2,p*(1+r));
  const high=Math.max(open,close)*(1+rnd()*0.014);
  const low=Math.min(open,close)*(1-rnd()*0.014);
  const vol=Math.round((0.55+rnd()*1.35)*stock.base*42000);
  bars.push({o:open,c:close,h:high,l:low,v:vol});
  p=close;
 }
 const last=bars[bars.length-1];
 last.c=stock.base*(1+(rnd()-0.5)*0.035);
 last.h=Math.max(last.o,last.c)*(1+rnd()*0.012);
 last.l=Math.min(last.o,last.c)*(1-rnd()*0.012);
 bars.prevClose=bars[bars.length-2].c;
 return bars;
}
function genMinute(prevClose,curPrice,seedKey){
 const rnd=seedRand(codeSeed(seedKey+'minute'));
 const N=240,pts=[];let p=prevClose;
 for(let i=0;i<N;i++){
  const pull=(curPrice-p)/Math.max(1,N-i);
  p=p+pull+(rnd()-0.5)*prevClose*0.0024;
  pts.push(p);
 }
 pts[N-1]=curPrice;return pts;
}
function makeQuote(stock){
 const daily=genDaily(stock);
 const prevClose=daily.prevClose;
 const price=daily[daily.length-1].c;
 const vol=daily[daily.length-1].v;
 const rnd=seedRand(codeSeed(stock.code)+99);
 return {
  code:stock.code,daily,prevClose,price,
  minute:genMinute(prevClose,price,stock.code),
  open:daily[daily.length-1].o,high:daily[daily.length-1].h,low:daily[daily.length-1].l,
  vol,amt:vol*price*100,
  inflow:(rnd()-0.38)*stock.base*90000,
  fundRatio:(rnd()-0.42)*16,
  anchor:price,anchorT:Date.now(),alerted:false,
  history:[],cooldown:{},surgeTicks:0,surgeDir:0,
  avg5Vol:daily.slice(-6,-1).reduce((a,b)=>a+b.v,0)/5
 };
}

function beep(severe){

 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  o.frequency.value=severe?920:620;o.type='sine';
  g.gain.setValueAtTime(.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.02);

function pushEvent(stock,type,title,text,severe){
 if(!stock)return;
 const now=Date.now();const q=quotes[stock.code];if(!q)return;
 const cdMap={volume:1500,fund:900,limit:800,speed:650,price:650};
 if(q.cooldown[type]&&now-q.cooldown[type]<cdMap[type])return;
 q.cooldown[type]=now;
 const ev={name:stock.name,code:stock.code,type,title,text,t:nowTime(),sev:!!severe};
 events.unshift(ev);if(events.length>45)events.pop();
 beep(severe&&eventUp(ev));

function scanRadar(){
 const t=Date.now();
 STOCKS.filter(s=>(radarCfg.scope==='all'&&!isExternal(s.code))||watchlist.includes(s.code)).forEach(s=>{
  const q=quotes[s.code];if(!q)return;
  q.history.push({t,p:q.price});
  while(q.history.length>1&&q.history[0].t<t-650000)q.history.shift();
  let ref=null;
  for(let i=0;i<q.history.length;i++){if(t-q.history[i].t>=55000)ref=q.history[i];else break;}
  if(radarCfg.speed&&ref){
   const m=(q.price-ref.p)/ref.p;
   if(Math.abs(m)>=radarCfg.speedTh/100)pushEvent(s,'speed',m>=0?'急拉':'急跌','1分钟涨速 '+(m*100).toFixed(2)+'%',Math.abs(m)>=radarCfg.speedSev/100);
  }
  const pc=pct(q),lim=limitPct(s.code);
  if(radarCfg.limit&&!isExternal(s.code)){
   if(pc>=lim-radarCfg.limitDist)pushEvent(s,'limit','冲击涨停','涨幅 '+pc.toFixed(2)+'%，逼近涨停价',true);
   if(pc<=-(lim-radarCfg.limitDist))pushEvent(s,'limit','逼近跌停','跌幅 '+pc.toFixed(2)+'%，注意短线风险',true);
  }
  const move=(q.price-q.anchor)/q.anchor;
  if(radarCfg.price&&!q.alerted&&Math.abs(move)>=radarCfg.priceTh/100){
   q.alerted=true;
   pushEvent(s,'price',move>=0?'急拉':'急跌','30秒内'+(move>=0?'拉升':'跳水')+' '+(move*100).toFixed(2)+'%',true);
   toast(s.name+(move>=0?' 拉升 ':' 跳水 ')+fPct(move*100),move>=0?'up':'down');
  }
  if(Math.abs(move)<.009)q.alerted=false;
  const ratio=q.vol/Math.max(1,q.avg5Vol);
  if(radarCfg.volume&&ratio>=radarCfg.volumeTh&&!isExternal(s.code)){
   pushEvent(s,'volume',pc>=0?'放量上攻':'放量下杀','估算量比 '+ratio.toFixed(1)+' · '+fPct(pc),ratio>=radarCfg.volumeSev);
  }
  if(radarCfg.fund&&!isExternal(s.code)){
   if(q.fundRatio>=radarCfg.fundTh)pushEvent(s,'fund','主力抢筹','主力净占比 '+q.fundRatio.toFixed(1)+'% · 净流入 '+fAmt(q.inflow),true);
   if(q.fundRatio<=-radarCfg.fundTh)pushEvent(s,'fund','主力出逃','主力净占比 '+q.fundRatio.toFixed(1)+'% · 净流出 '+fAmt(-q.inflow),true);
  }
 });
}

function injectSurge(){

function tick(){
 if(!simOn)return;
 STOCKS.forEach(s=>{
  if(isIndex(s.code))return;
  const q=quotes[s.code];if(!q)return;
  let r=(Math.random()-0.5)*0.006;
  if(q.surgeTicks>0){
   r+=q.surgeDir*(0.006+Math.random()*0.006);
   q.surgeTicks--;
  }
  let np=q.price*(1+r);
  np=Math.max(.2,Math.round(np*100)/100);
  q.price=np;
  q.high=Math.max(q.high,np);q.low=Math.min(q.low,np);
  q.vol+=Math.round(Math.random()*s.base*420);
  q.amt=q.vol*np*100;
  q.inflow+=(Math.random()-0.48)*s.base*2600;
  q.fundRatio=clamp(q.fundRatio+(Math.random()-0.5)*0.8,-24,24);
  if(q.minute.length)q.minute[q.minute.length-1]=np;
  const b=q.daily[q.daily.length-1];b.c=np;b.h=q.high;b.l=q.low;b.v=q.vol;
 });
 INDICES.forEach(i=>{
  i.v*=1+(Math.random()-0.5)*0.0009;

  if(q){
   q.price=i.v;
   q.high=Math.max(q.high,i.v);q.low=Math.min(q.low,i.v);
   const b=q.daily[q.daily.length-1];
   b.c=i.v;b.h=q.high;b.l=q.low;
   if(q.minute.length)q.minute[q.minute.length-1]=i.v;

 });

 });
 scanRadar();
 render();
}

const canvas=$('chart'),ctx=canvas.getContext('2d');
function fitCanvas(){
 const dpr=window.devicePixelRatio||1;
 const r=canvas.getBoundingClientRect();
 canvas.width=Math.max(1,Math.round(r.width*dpr));
 canvas.height=Math.max(1,Math.round(r.height*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);
 return r;
}
function drawChart(){
 const r=fitCanvas(),W=r.width,H=r.height;
 ctx.clearRect(0,0,W,H);

 if(!q||W<40||H<40)return;
 if(chartMode==='min')drawMin(q,W,H);else drawK(q,W,H);
}
function drawGrid(W,padR,padT,ch,mx,rng){
 ctx.strokeStyle='#2a313c';ctx.fillStyle='#8b949e';ctx.font='10px sans-serif';ctx.textBaseline='middle';
 for(let i=0;i<=4;i++){
  const yy=padT+ch*i/4;
  ctx.beginPath();ctx.moveTo(8,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
  ctx.fillText((mx-rng*i/4).toFixed(2),W-padR+4,yy);
 }
}
function drawMin(q,W,H){
 const padL=8,padR=64,padT=18,padB=22,cw=W-padL-padR,ch=H-padT-padB;
 const pts=q.minute,prev=q.prevClose;
 const vals=pts.concat([prev]);
 const mx=Math.max(...vals),mn=Math.min(...vals),rng=mx-mn||1;
 const y=v=>padT+(mx-v)/rng*ch,x=i=>padL+i/(pts.length-1)*cw;
 drawGrid(W,padR,padT,ch,mx,rng);
 ctx.setLineDash([4,3]);ctx.strokeStyle='#8b949e';
 ctx.beginPath();ctx.moveTo(padL,y(prev));ctx.lineTo(W-padR,y(prev));ctx.stroke();ctx.setLineDash([]);
 let sum=0;
 ctx.strokeStyle='#e6b800';ctx.lineWidth=1;ctx.beginPath();
 pts.forEach((v,i)=>{sum+=v;const av=sum/(i+1);i?ctx.lineTo(x(i),y(av)):ctx.moveTo(x(i),y(av));});
 ctx.stroke();
 const up=q.price>=prev,col=up?'#f5455c':'#22c55e';
 ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
 ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.stroke();
 ctx.lineTo(x(pts.length-1),padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();
 ctx.fillStyle=up?'rgba(245,69,92,.12)':'rgba(34,197,94,.12)';ctx.fill();
 ctx.fillStyle='#8b949e';
 const labels=(isExternal(selectedCode)&&!isIndex(selectedCode))?['开盘','','盘中','','收盘']:['09:30','10:30','11:30','14:00','15:00'];
 labels.forEach((t,i)=>{ctx.fillText(t,padL+cw*i/4-(t.length>2?14:12),H-7);});

function ma(n,arr,i){if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=arr[j].c;return s/n;}
function drawK(q,W,H){
 const bars=q.daily,padL=8,padR=64,padT=18,padB=32;
 const cw=W-padL-padR,allH=H-padT-padB,priceH=allH*.72,volH=allH*.28;
 const show=W<650?90:140,data=bars.slice(-show);
 const mx=Math.max(...data.map(b=>b.h)),mn=Math.min(...data.map(b=>b.l)),rng=mx-mn||1;
 const y=v=>padT+(mx-v)/rng*priceH,bw=cw/show*.7,bx=i=>padL+cw*(i+.5)/show;
 const maxV=Math.max(...data.map(b=>b.v))||1;
 drawGrid(W,padR,padT,priceH,mx,rng);
 data.forEach((b,i)=>{
  ctx.fillStyle=b.c>=b.o?'rgba(245,69,92,.55)':'rgba(34,197,94,.55)';
  ctx.fillRect(bx(i)-bw/2,padT+priceH+volH-b.v/maxV*volH,bw,b.v/maxV*volH);
 });
 data.forEach((b,i)=>{
  const col=b.c>=b.o?'#f5455c':'#22c55e';
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(bx(i),y(b.h));ctx.lineTo(bx(i),y(b.l));ctx.stroke();
  ctx.fillRect(bx(i)-bw/2,y(Math.max(b.o,b.c)),bw,Math.max(1,Math.abs(y(b.o)-y(b.c))));
 });
 [[5,'#e6b800'],[10,'#3b82f6'],[20,'#a78bfa']].forEach(([n,col])=>{
  ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();let started=false;
  data.forEach((_,i)=>{
   const real=bars.length-show+i,v=ma(n,bars,real);if(v==null)return;
   started?ctx.lineTo(bx(i),y(v)):ctx.moveTo(bx(i),y(v));started=true;
  });
  ctx.stroke();ctx.fillStyle=col;ctx.fillText('MA'+n,padL+(n===5?4:n===10?52:100),7);
 });
 ctx.fillStyle='#8b949e';
 [0,Math.round(show*.25),Math.round(show*.5),Math.round(show*.75),show-1].forEach(i=>{
  if(!data[i])return;const d=new Date();d.setDate(d.getDate()-(show-1-i));
  ctx.fillText((d.getMonth()+1)+'/'+d.getDate(),bx(i)-14,H-12);
 });
}

function linkifyReview(){
 const root=$('reviewView');
 if(!root)return;
 const names=STOCKS.map(s=>({code:s.code,name:s.name})).sort((a,b)=>b.name.length-a.name.length);
 const pattern=new RegExp(names.map(x=>escapeRegExp(x.name)).join('|'),'g');
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
  acceptNode(node){
   if(!node.nodeValue||!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;
   const p=node.parentElement;
   if(!p)return NodeFilter.FILTER_REJECT;
   if(p.closest('.quote-link,button,script,style,[data-code]'))return NodeFilter.FILTER_REJECT;
   return NodeFilter.FILTER_ACCEPT;
  }
 });
 const nodes=[];
 let node;
 while((node=walker.nextNode()))nodes.push(node);
 nodes.forEach(textNode=>{
  const text=textNode.nodeValue;
  pattern.lastIndex=0;
  let m,last=0;
  const frag=document.createDocumentFragment();
  while((m=pattern.exec(text))){
   const matched=m[0];
   const item=names.find(x=>x.name===matched);
   if(!item)continue;
   if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));
   const span=document.createElement('span');
   span.className='quote-link';
   span.dataset.code=item.code;
   span.tabIndex=0;
   span.textContent=matched;
   frag.appendChild(span);
   last=m.index+matched.length;
  }
  if(last>0){
   if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
   textNode.replaceWith(frag);
  }
 });
}

 const csv='\ufeff代码,名称,板块,现价,涨跌幅,成交量,主力净流入\n'+rows.join('\n');
 downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'科技股雷达_自选_'+todayKey()+'.csv');
 toast('自选CSV已导出','info');
}
function exportReport(){
 const arr=STOCKS.filter(s=>watchlist.includes(s.code)).map(s=>({s,q:quotes[s.code]}));
 const byPct=arr.slice().sort((a,b)=>pct(b.q)-pct(a.q));
 const byFund=arr.slice().sort((a,b)=>b.q.inflow-a.q.inflow);
 const lines=[];
 lines.push('科技股雷达 · 盯盘复盘报告');
 lines.push('日期：'+todayKey()+'  生成时间：'+nowTime());
 lines.push('数据源：本地演示数据源，正式接入时需替换为授权行情源');
 lines.push('');
 lines.push('一、市场指数');
 INDICES.forEach(i=>lines.push(i.name+'　'+i.v.toFixed(2)+'　'+fPct(i.p)));
 lines.push('');
 lines.push('二、自选股表现');
 arr.forEach((x,i)=>lines.push((i+1)+'. '+x.s.name+'（'+x.s.code+'）  现价 '+x.q.price.toFixed(2)+'  '+fPct(pct(x.q))+'  成交量 '+fVol(x.q.vol)+'  主力净流入 '+fAmt(x.q.inflow)));
 lines.push('');
 lines.push('三、涨幅前5');
 byPct.slice(0,5).forEach((x,i)=>lines.push((i+1)+'. '+x.s.name+'  '+fPct(pct(x.q))));
 lines.push('');
 lines.push('四、主力净流入前5');
 byFund.slice(0,5).forEach((x,i)=>lines.push((i+1)+'. '+x.s.name+'  '+fAmt(x.q.inflow)));
 lines.push('');
 lines.push('五、雷达历史事件');
 if(events.length){events.forEach((e,i)=>lines.push((i+1)+'. '+e.t+' '+e.name+' · '+e.title+' '+e.text));}else{lines.push('暂无雷达触发事件。');}
 lines.push('');
 lines.push('免责声明：本报告由本地规则自动生成，仅用于产品演示，不构成任何投资建议。');
 downloadBlob(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),'科技股雷达_复盘报告_'+todayKey()+'.txt');

/* ---------------- 弹窗 ---------------- */
function openModal(id){$(id).hidden=false;document.body.style.overflow='hidden';}
function closeModal(id){$(id).hidden=true;document.body.style.overflow='';}
function toggleCfgDisabled(){
 document.querySelectorAll('.cfg-en').forEach(cb=>{
  const row=cb.closest('.cfg-row');
  row.classList.toggle('disabled',!cb.checked);
  row.querySelectorAll('input[type="number"]').forEach(i=>i.disabled=!cb.checked);
 });

function fillRadarForm(){
 $('scopeWatch').checked=radarCfg.scope==='watch';
 $('scopeAll').checked=radarCfg.scope==='all';
 $('enSpeed').checked=radarCfg.speed;
 $('enPrice').checked=radarCfg.price;
 $('enVolume').checked=radarCfg.volume;
 $('enFund').checked=radarCfg.fund;
 $('enLimit').checked=radarCfg.limit;
 $('cfgSpeed').value=radarCfg.speedTh.toFixed(1);
 $('cfgSpeedSev').value=radarCfg.speedSev.toFixed(1);
 $('cfgPrice').value=radarCfg.priceTh.toFixed(1);
 $('cfgVolume').value=radarCfg.volumeTh.toFixed(1);
 $('cfgVolumeSev').value=radarCfg.volumeSev.toFixed(1);
 $('cfgFund').value=radarCfg.fundTh.toFixed(1);
 $('cfgLimit').value=radarCfg.limitDist.toFixed(1);
 $('radarError').textContent='';
 toggleCfgDisabled();
}
function readRadarForm(){
 const errs=[];
 const num=(id,label,min,max)=>{
  const n=parseFloat($(id).value);
  if(!Number.isFinite(n)){errs.push(label+'需填写数字');return NaN;}
  if(n<min||n>max){errs.push(label+'应在 '+min+'～'+max+' 之间');return clamp(n,min,max);}
  return n;
 };
 const speedTh=num('cfgSpeed','1分钟涨速触发阈值',.2,9);
 const speedSev=num('cfgSpeedSev','1分钟涨速强提醒阈值',.2,9);
 const priceTh=num('cfgPrice','30秒价格异动阈值',.2,10);
 const volumeTh=num('cfgVolume','放量触发量比',1.1,10);
 const volumeSev=num('cfgVolumeSev','放量强提醒量比',1.1,15);
 const fundTh=num('cfgFund','主力净占比阈值',1,25);
 const limitDist=num('cfgLimit','涨跌停预警距离',.1,5);
 if(Number.isFinite(speedTh)&&Number.isFinite(speedSev)&&speedSev<speedTh)errs.push('1分钟涨速强提醒阈值不能小于触发阈值');
 if(Number.isFinite(volumeTh)&&Number.isFinite(volumeSev)&&volumeSev<volumeTh)errs.push('放量强提醒量比不能小于触发量比');
 if(errs.length)return {error:errs.join('；')};
 return {cfg:{
  scope:document.querySelector('input[name="radarScope"]:checked')?.value||'watch',
  speed:$('enSpeed').checked,price:$('enPrice').checked,volume:$('enVolume').checked,fund:$('enFund').checked,limit:$('enLimit').checked,
  speedTh,speedSev,priceTh,volumeTh,volumeSev,fundTh,limitDist
 }};
}

 document.querySelectorAll('.tab,.mn-tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));
 $('monitorView').style.display=view==='monitor'?'grid':'none';

 $('sourceView').classList.toggle('show',view==='source');

}

 if(el)gotoTarget(el.dataset.code);

$('sectorList').addEventListener('click',e=>{

$('stockList').addEventListener('click',e=>{

 });
 renderStockList();
});
$('batchDelBtn').addEventListener('click',()=>{
 if(!batchPick.size)return;
 removeWatchCodes([...batchPick]);
});

const searchInput=$('searchInput'),searchResult=$('searchResult'),searchHint=$('searchHint');
searchInput.addEventListener('input',()=>{
 const kw=searchInput.value.trim();
 if(!kw){searchResult.classList.remove('show');searchHint.classList.remove('show');searchHint.className='search-hint';return;}
 const res=STOCKS.filter(s=>(!isExternal(s.code)||isIndex(s.code))&&stockMatches(s,kw)).slice(0,8);
 const short=!/^\d{6}$/.test(kw)&&kw.length<2;
 const aliasHit=res.some(s=>!s.code.includes(kw)&&!s.name.includes(kw));
 const full=domesticCount()>=WATCH_A_LIMIT&&res.some(s=>!isIndex(s.code)&&!watchlist.includes(s.code));
 let hint='',info=false;
 if(short)hint='输入 6 位代码或股票名称关键字，例如“中际”或“300308”。';
 else if(full)hint='自选A股已满50只，请先在下方“管理”中移除部分标的后再添加。';
 else if(aliasHit){hint='未找到名称完全一致的A股，已匹配名称相近的长川科技（300604）。';info=true;}
 searchHint.textContent=hint;
 searchHint.className='search-hint'+(hint?' show':'')+(info?' info':'');
 const stockHtml=res.length?res.map(s=>{
  const added=watchlist.includes(s.code);
  const alias=!s.code.includes(kw)&&!s.name.includes(kw);
  const action=isIndex(s.code)?'查看分时/日K':added?'已添加':'+ 添加';
  return '<div class="sr-item" data-add="'+s.code+'"><span>'+s.name+' <span class="muted">'+s.code+' · '+s.sector+(alias?' · 名称近似':'')+'</span></span><span>'+action+'</span></div>';
 }).join(''):'';
 searchResult.innerHTML=stockHtml||'<div class="sr-item"><span>未找到匹配标的</span><span class="muted">换个关键字试试</span></div>';
 searchResult.classList.add('show');
});
searchResult.addEventListener('click',e=>{
 const el=e.target.closest('[data-add]');if(!el)return;
 const code=el.dataset.add;
 if(isIndex(code)){
  searchInput.value='';searchResult.classList.remove('show');searchHint.classList.remove('show');
  gotoTarget(code);
  return;
 }
 if(addWatch(code)){
  selectedCode=code;activeSector='全部';
  searchInput.value='';searchResult.classList.remove('show');searchHint.classList.remove('show');
  toast('已添加 '+quotes[code].name,'info');
  render();
 }
});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))searchResult.classList.remove('show');});
$('simBtn').addEventListener('click',()=>{simOn=!simOn;render();});
$('soundBtn').addEventListener('click',()=>{
 soundOn=!soundOn;$('soundBtn').textContent='🔊 声音：'+(soundOn?'开':'关');if(soundOn)beep(true);
});
$('notifBtn').addEventListener('click',()=>{
 if(!('Notification'in window)){toast('当前浏览器不支持桌面通知','info');return;}
 if(!notifOn){
  Notification.requestPermission().then(p=>{
   notifOn=p==='granted';$('notifBtn').textContent='🔔 通知：'+(notifOn?'开':'关');
   if(notifOn)notify('科技雷达','异动时将弹出桌面通知');
  });
 }else{notifOn=false;$('notifBtn').textContent='🔔 通知：关';}
});
$('resetBtn').addEventListener('click',()=>{
 watchlist=DEFAULT_WATCH.slice();activeSector='全部';selectedCode=watchlist[0];saveWatch();
 setManageMode(false);render();toast('已恢复默认50只自选股','info');
});
function updateRefreshButton(){
 const btn=$('refreshBtn');if(!btn.disabled)btn.textContent='🔄 '+Math.max(0,cd)+'s';
}

 setTimeout(()=>{
  if(simOn)tick();

 },650);
});
$('alertList').addEventListener('click',e=>{
 const row=e.target.closest('[data-code]');if(row)gotoTarget(row.dataset.code);
});
$('reviewView').addEventListener('click',e=>{
 const row=e.target.closest('[data-code]');if(row)gotoTarget(row.dataset.code);
});
document.addEventListener('keydown',e=>{
 const el=e.target.closest?.('.idx[data-code],.quote-link[data-code]');
 if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();gotoTarget(el.dataset.code);}
});
function gotoTarget(code){
 if(!quotes[code])return;
 if(isIndex(code)){
  selectedCode=code;activeSector='全部';
  setView('monitor');
  render();
  return;
 }
 if(!watchlist.includes(code)&&!addWatch(code)){
  selectedCode=code;activeSector='全部';
  setView('monitor');
  render();
  return;
 }
 selectedCode=code;activeSector=isExternal(code)?'全部':(STOCKS.find(s=>s.code===code)?.sector||'全部');
 setView('monitor');
 render();
}

/* 数据源页与导入导出 */
$('sourceView').addEventListener('click',e=>{
 const action=e.target.closest('[data-action]');
 if(!action)return;
 const act=action.dataset.action;
 if(act==='refresh'){
  if(simOn)tick();
  anchorRefresh();
  renderSource();
 }
 if(act==='export-report')exportReport();
 if(act==='export-csv')exportWatchCsv();
 if(act==='import-json')$('importWatchFile').click();
 if(act==='reset-cache'){
  localStorage.removeItem('sm_watch_v2');
  localStorage.removeItem('sm_radar_cfg_v1');
  localStorage.removeItem('sm_data_cfg_v1');
  toast('已清除本地数据，即将重置','info');
  setTimeout(()=>location.reload(),700);
 }
});
$('sourceView').addEventListener('change',e=>{
 if(e.target.name==='srcInterval'){
  const v=parseInt(e.target.value,10);
  if([1500,3000,5000].includes(v)){
   dataCfg.interval=v;
   saveDataCfg();
   startTimers();
   toast('行情刷新频率已切换为 '+(v/1000)+' 秒','info');
   renderSource();
  }
 }
});
$('importWatchFile').addEventListener('change',e=>{
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=JSON.parse(reader.result);
   const codes=Array.isArray(obj)?obj:obj.watchlist||obj.codes;
   if(!Array.isArray(codes))throw new Error('bad');
   let added=0;
   codes.forEach(c=>{
    if(typeof c==='string'&&quotes[c]&&!watchlist.includes(c)&&addWatch(c))added++;
   });
   render();renderSource();
   toast('已导入 '+added+' 只自选股','info');
  }catch(err){
   toast('JSON格式不正确，需为代码数组或 {watchlist:[...]}','info');
  }
  e.target.value='';
 };
 reader.readAsText(file);
});
