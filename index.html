<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>科技股雷达 · 实时盯盘复盘</title>
<style>
:root{--bg:#0e1116;--pn:#161b22;--pn2:#1c232d;--bd:#2a313c;--tx:#e6edf3;--mu:#8b949e;
--up:#f5455c;--dn:#22c55e;--ac:#3b82f6;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit}
[hidden]{display:none!important}
.up{color:var(--up)!important}.dn{color:var(--dn)!important}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
/* 顶栏 */
.top{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--pn);
border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}.brand i{color:var(--ac);font-style:normal}
.tabs{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:8px}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--mu);white-space:nowrap;user-select:none}
.tab.active{background:var(--pn2);color:var(--tx)}
.sp{flex:1}
.net{font-size:11px;padding:3px 9px;border-radius:11px;background:#2a313c55;color:var(--mu);white-space:nowrap}
.net.ok{background:rgba(34,197,94,.16);color:var(--dn)}.net.err{background:rgba(245,69,92,.16);color:var(--up)}
.clock{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{padding:5px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--pn2);
color:var(--tx);cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.5)}
.btn.dgr{background:rgba(245,69,92,.14);border-color:rgba(245,69,92,.45)}
.mini{padding:1px 7px;font-size:11px;border:1px solid var(--bd);background:var(--bg);
color:var(--mu);border-radius:5px;cursor:pointer}
.mini:hover{color:var(--tx);border-color:var(--ac)}
/* 指数条 */
.idxbar{display:flex;gap:8px;padding:7px 12px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto}
.idx{display:flex;align-items:baseline;gap:7px;padding:5px 10px;background:var(--pn2);
border:1px solid var(--bd);border-radius:7px;cursor:pointer;white-space:nowrap}
.idx:hover{border-color:var(--ac)}
.idx .n{color:var(--mu);font-size:12px}
.idx .p{font-weight:700;font-variant-numeric:tabular-nums}
.idx .c{font-size:12px;font-variant-numeric:tabular-nums}
/* 主体 */
.main{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:8px;padding:8px;min-height:0}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);
display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pn>h3{padding:9px 11px;font-size:13px;border-bottom:1px solid var(--bd);display:flex;
justify-content:space-between;align-items:center;flex-shrink:0;gap:6px}
.pn>h3 .mu{color:var(--mu);font-weight:400;font-size:11px}
.secs{padding:6px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;max-height:168px;
flex-shrink:0;border-bottom:1px solid var(--bd)}
.sec{padding:6px 9px;border-radius:6px;cursor:pointer;color:var(--mu);
display:flex;justify-content:space-between}
.sec:hover{background:var(--pn2);color:var(--tx)}
.sec.active{background:var(--ac);color:#fff}
.sec .c{font-size:11px;opacity:.8}
.sbox{padding:7px;border-bottom:1px solid var(--bd);position:relative;flex-shrink:0}
.sbox input{width:100%;padding:7px 9px;background:var(--bg);border:1px solid var(--bd);
border-radius:6px;color:var(--tx);font-size:12px;outline:none}
.sbox input:focus{border-color:var(--ac)}
.sres{position:absolute;top:44px;left:7px;right:7px;background:var(--pn2);border:1px solid var(--bd);
border-radius:7px;z-index:30;max-height:240px;overflow-y:auto;display:none;box-shadow:0 12px 30px #0006}
.sres.show{display:block}
.sr{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;font-size:12px}
.sr:hover{background:var(--ac)}
.sr .mu{color:var(--mu);font-size:11px}
.mbar{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--bd);
flex-shrink:0;font-size:12px;color:var(--mu)}
.slist{flex:1;overflow-y:auto}
.stk{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--bd);cursor:pointer}
.stk:hover{background:var(--pn2)}
.stk.sel{background:var(--pn2);border-left:2px solid var(--ac);padding-left:9px}
.stk .pick{width:14px;height:14px;accent-color:var(--ac);flex-shrink:0}
.stk .info{flex:1;min-width:0}
.stk .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk .cd{color:var(--mu);font-size:11px}
.stk .tag{font-size:10px;color:var(--ac);border:1px solid rgba(59,130,246,.4);
border-radius:4px;padding:0 4px;margin-left:4px}
.stk .rt{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.stk .px{font-size:12px}.stk .pc{font-size:11px}
.stk .del{color:var(--mu);background:none;border:none;cursor:pointer;font-size:15px;
flex-shrink:0;padding:0 3px;line-height:1}
.stk .del:hover{color:var(--up)}
.empty{padding:18px 14px;color:var(--mu);font-size:12px;text-align:center;line-height:1.8}
/* 详情 */
.dhead{padding:11px 14px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dh1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.dh1 .nm{font-size:16px;font-weight:700}
.dh1 .cd{color:var(--mu);font-size:12px}
.tag{font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:1px 6px}
.dh2{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.dh2 .px{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.dh2 .pc{font-size:13px;font-variant-numeric:tabular-nums}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:2px 12px}
.dst{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.dst .l{color:var(--mu)}.dst .v{font-variant-numeric:tabular-nums}
.dnote{display:flex;gap:6px;margin-top:8px}
.dnote input{flex:1;padding:4px 8px;background:var(--bg);border:1px solid var(--bd);
border-radius:5px;color:var(--tx);font-size:12px;outline:none}
.cwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 8px 8px}
.ctabs{display:flex;gap:4px;padding:7px 0}
.ctab{padding:3px 12px;border-radius:6px;cursor:pointer;color:var(--mu);font-size:12px;background:var(--pn2)}
.ctab.active{background:var(--ac);color:#fff}
canvas{flex:1;width:100%;min-height:120px;display:block}
/* 雷达 */
.alist{flex:1;overflow-y:auto}
.aitem{padding:8px 11px;border-bottom:1px solid var(--bd);cursor:pointer}
.aitem:hover{background:var(--pn2)}
.aitem.sev{background:rgba(245,69,92,.06)}
.aitem .t1{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600}
.aitem .t1 .tm{color:var(--mu);font-weight:400;font-size:11px}
.aitem .t2{color:var(--mu);font-size:11px;margin-top:2px}
/* 状态条 */
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 8px 8px}
.pcard{background:var(--pn);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}
.pcard .k{color:var(--mu);font-size:11px;margin-bottom:4px}
.pcard .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 复盘 / 设置 */
.rv{flex:1;overflow-y:auto;padding:10px;display:none}
.rv.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:12px;min-width:0}
.card h4{font-size:13px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.card h4 .mu{color:var(--mu);font-weight:400;font-size:11px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #20262f;
font-size:12px;cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{color:var(--ac)}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .nu{color:var(--mu);width:16px;flex-shrink:0}
.row .nmx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:#20262f;margin-top:3px;overflow:hidden}
.bar>i{display:block;height:100%}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:flex;
align-items:center;justify-content:center;padding:16px}
.modal{background:var(--pn);border:1px solid var(--bd);border-radius:12px;width:100%;
max-width:520px;max-height:86vh;display:flex;flex-direction:column}
.modal h2{font-size:15px;padding:13px 16px;border-bottom:1px solid var(--bd)}
.mbody{padding:14px 16px;overflow-y:auto}
.mfoot{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;
border-bottom:1px solid #20262f;font-size:12px}
.frow:last-child{border-bottom:none}
.frow input[type=number]{width:74px;padding:4px 6px;background:var(--bg);border:1px solid var(--bd);
border-radius:5px;color:var(--tx);font-size:12px;text-align:right}
.frow input[type=checkbox]{accent-color:var(--ac)}
.hint{color:var(--mu);font-size:11px;line-height:1.7;margin-top:8px}
.toast{position:fixed;top:60px;right:16px;z-index:99;background:rgba(59,130,246,.95);color:#fff;
padding:9px 13px;border-radius:8px;font-size:12px;box-shadow:0 4px 18px #0007}
.mnav{display:none}
@media(max-width:900px){
 .main{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow-y:auto}
 .mnav{display:flex;gap:6px;padding:6px;background:var(--pn);border-top:1px solid var(--bd)}
 .mnav .tab{flex:1;text-align:center}
 .pulse{grid-template-columns:repeat(2,1fr)}
 .net,.clock{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i>◈</i> 科技股雷达</div>
  <nav class="tabs">
    <div class="tab active" data-view="monitor">盯盘</div>
    <div class="tab" data-view="review">收盘复盘</div>
  </nav>
  <div class="sp"></div>
  <span class="net" id="net">● 连接中…</span>
  <div class="clock" id="clock">--:--:--</div>
  <button class="btn" id="expBtn" title="导出复盘报告">📄</button>
  <button class="btn pri" id="refBtn">🔄 刷新</button>
  <button class="btn" id="setBtn">⚙️</button>
</div>

<div class="idxbar" id="idxbar"></div>

<div class="pulse" id="pulse"></div>

<main class="main" id="monitorView">
  <section class="pn">
    <h3><span>板块</span><span class="mu" id="watchCnt"></span></h3>
    <div class="secs" id="secs"></div>
    <div class="sbox">
      <input id="sInput" placeholder="搜索代码 / 名称，添加自选…" autocomplete="off">
      <div class="sres" id="sRes"></div>
    </div>
    <div style="padding:7px 9px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;flex-shrink:0">
      <span style="font-size:12px;color:var(--mu)">自选股</span>
      <span class="sp"></span>
      <button class="mini" id="mBtn">管理</button>
    </div>
    <div class="mbar" id="mBar" hidden>
      <label><input type="checkbox" id="pAll"> 全选</label>
      <button class="btn dgr" id="bDel" disabled>删除所选</button>
      <span class="sp"></span>
      <button class="mini" id="mDone">完成</button>
    </div>
    <div class="slist" id="sList"></div>
  </section>

  <section class="pn">
    <div class="dhead" id="dHead"></div>
    <div class="cwrap">
      <div class="ctabs">
        <div class="ctab active" data-mode="min">分时</div>
        <div class="ctab" data-mode="kline">日K</div>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </section>

  <section class="pn">
    <h3><span>雷达预警</span><span class="mu">真实涨速 / 量比 / 主力资金</span></h3>
    <div class="alist" id="aList"></div>
  </section>
</main>

<section class="rv" id="reviewView"></section>

<nav class="mnav">
  <div class="tab active" data-view="monitor">📡 盯盘</div>
  <div class="tab" data-view="review">📊 复盘</div>
</nav>

<div class="mask" id="setMask" hidden>
  <div class="modal">
    <h2>设置</h2>
    <div class="mbody">
      <div class="frow"><span>行情刷新频率</span>
        <select id="ivSel" class="mini" style="padding:4px 6px">
          <option value="2000">2 秒</option><option value="3000">3 秒（推荐）</option>
          <option value="5000">5 秒</option><option value="10000">10 秒</option>
        </select></div>
      <div class="frow"><span>雷达提示音</span><input type="checkbox" id="soundChk"></div>
      <div class="frow"><span>桌面通知（限频 1 条/8 秒）</span><input type="checkbox" id="notifChk"></div>
      <div class="frow"><span>雷达监测范围</span>
        <select id="scopeSel" class="mini" style="padding:4px 6px">
          <option value="watch">仅我的自选股</option><option value="all">全部 50 只科技股</option>
        </select></div>
      <div class="frow"><span>涨速阈值(%)</span><input type="number" id="thSpeed" step="0.1"></div>
      <div class="frow"><span>量比阈值</span><input type="number" id="thVol" step="0.1"></div>
      <div class="frow"><span>主力净占比阈值(%)</span><input type="number" id="thFund" step="0.1"></div>
      <div class="frow"><span>涨跌停临近距离(%)</span><input type="number" id="thLimit" step="0.1"></div>
      <div class="hint" id="setHint">
        数据源：东方财富公开行情接口（JSONP），异常时自动切腾讯行情备用源。<br>
        所有数字均来自接口，非交易时段显示最新收盘值。
      </div>
      <div class="frow" style="margin-top:6px"><span>接口自检（结果打印到控制台）</span>
        <button class="mini" id="selfChk">运行</button></div>
    </div>
    <div class="mfoot">
      <button class="btn dgr" id="clrBtn">清空本地数据</button>
      <span class="sp"></span>
      <button class="btn" id="setClose">关闭</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ==================== 1. 静态基础数据 ==================== */
const SECTORS=['光模块','光纤光缆','电源','MLCC','半导体设备','半导体材料','光刻胶','靶材','存储'];
const RAW=[
 ['300308','中际旭创','光模块'],['300502','新易盛','光模块'],['300394','天孚通信','光模块'],
 ['002281','光迅科技','光模块'],['000988','华工科技','光模块'],['603083','剑桥科技','光模块'],
 ['300548','博创科技','光模块'],['300620','光库科技','光模块'],
 ['601869','长飞光纤','光纤光缆'],['600487','亨通光电','光纤光缆'],['600522','中天科技','光纤光缆'],
 ['600498','烽火通信','光纤光缆'],['002491','通鼎互联','光纤光缆'],
 ['002851','麦格米特','电源'],['300870','欧陆通','电源'],['300582','英飞特','电源'],
 ['002993','奥海科技','电源'],['002782','可立克','电源'],['002885','京泉华','电源'],
 ['300408','三环集团','MLCC'],['000636','风华高科','MLCC'],['603678','火炬电子','MLCC'],
 ['603267','鸿远电子','MLCC'],['002859','洁美科技','MLCC'],
 ['002371','北方华创','半导体设备'],['688012','中微公司','半导体设备'],['688072','拓荆科技','半导体设备'],
 ['688120','华海清科','半导体设备'],['688082','盛美上海','半导体设备'],['688037','芯源微','半导体设备'],
 ['300604','长川科技','半导体设备'],
 ['688126','沪硅产业','半导体材料'],['605358','立昂微','半导体材料'],['688019','安集科技','半导体材料'],
 ['300054','鼎龙股份','半导体材料'],['300236','上海新阳','半导体材料'],
 ['603650','彤程新材','光刻胶'],['300655','晶瑞电材','光刻胶'],['300346','南大光电','光刻胶'],
 ['300576','容大感光','光刻胶'],
 ['300666','江丰电子','靶材'],['600206','有研新材','靶材'],['300263','隆华科技','靶材'],
 ['603986','兆易创新','存储'],['300223','北京君正','存储'],['301308','江波龙','存储'],
 ['688525','佰维存储','存储'],['001309','德明利','存储'],['688766','普冉股份','存储'],
 ['688110','东芯股份','存储']
];
const STOCKS=RAW.map(d=>({code:d[0],name:d[1],sector:d[2]}));
const ALIAS={'300604':['长鑫']};
const INDEX_DEFS=[
 {code:'1.000001',name:'上证指数'},{code:'0.399001',name:'深证成指'},
 {code:'0.399006',name:'创业板指'},{code:'1.000688',name:'科创50'}
];
/* 外围指数（可选）。若某个 secid 接口不支持，会自动隐藏，不影响其它数据。
   想增删/改代码，直接编辑这张表，然后点设置里的「接口自检」看返回。 */
const OUT_DEFS=[
 {code:'100.NDX',name:'纳斯达克'},{code:'100.SPX',name:'标普500'},{code:'100.DJIA',name:'道琼斯'}
];
/* 美股每日活跃 TOP20 的市场范围：105=纳斯达克 106=纽交所 107=美交所 */
const US_FS='m:105,m:106,m:107';

/* ==================== 2. 存储与状态 ==================== */
const LS={w:'kj_radar_watch',c:'kj_radar_cfg',n:'kj_radar_notes'};
const lget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(e){return d;}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const DEF_RADAR={scope:'watch',speedTh:1.0,volTh:2.0,fundTh:5.0,limitDist:1.5};
const _c=lget(LS.c,{});
let cfg={interval:[2000,3000,5000,10000].includes(+_c.interval)?+_c.interval:3000,
  sound:!!_c.sound,notif:!!_c.notif,radar:Object.assign({},DEF_RADAR,_c.radar||{})};
let watchlist=lget(LS.w,null);
if(!Array.isArray(watchlist)||!watchlist.length)watchlist=STOCKS.map(s=>s.code);
watchlist=watchlist.filter(c=>typeof c==='string'&&c);
let notes=lget(LS.n,{});
let board=[], events=[], activeSector='全部', chartMode='min', view='monitor';
let selected=watchlist[0]||STOCKS[0].code;
let manageMode=false, batchPick=new Set();
let net={ok:false,msg:'连接中…'}, srcName='东方财富', failCount=0;
let syncing=false, okCount=0, lastTrend=0, lastBoardAt=0, lastKlineAt=0, lastFull=0;

/* ==================== 3. 工具 ==================== */
const $=id=>document.getElementById(id);
const isExt=c=>!/^\d{6}$/.test(c);
const isIdx=c=>INDEX_DEFS.some(i=>i.code===c);
const limitPct=c=>{const s=String(c).replace(/^us/,'');return s[0]==='3'||s.indexOf('688')===0?20:10;};
const num=v=>typeof v==='number'&&isFinite(v)?v:null;
const f2=v=>num(v)!=null?v.toFixed(2):'--';
const fPct=v=>num(v)!=null?(v>=0?'+':'')+v.toFixed(2)+'%':'--';
const fVol=v=>num(v)==null?'--':(v>=1e8?(v/1e8).toFixed(2)+'亿手':(v/1e4).toFixed(1)+'万手');
const fAmt=v=>{if(num(v)==null)return '--';const s=v<0?'-':'',a=Math.abs(v);
  return s+(a>=1e8?(a/1e8).toFixed(2)+'亿':(a/1e4).toFixed(0)+'万');};
const nowTime=()=>new Date().toLocaleTimeString('zh-CN',{hour12:false});
const hhmm=ts=>ts?new Date(ts).toLocaleTimeString('zh-CN',{hour12:false}):'--';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pct(q){return q&&num(q.price)!=null&&num(q.prevClose)?(q.price-q.prevClose)/q.prevClose*100:null;}
function secid(c){
  if(!c)return null;
  if(c.indexOf('.')>0)return c;
  if(/^6/.test(c))return '1.'+c;
  if(/^(0|3|4|8)/.test(c))return '0.'+c;
  return null;
}
function txCode(c){
  if(c.indexOf('.')>0){const p=c.split('.');return (p[0]==='1'?'sh':'sz')+p[1];}
  return (/^6/.test(c)?'sh':'sz')+c;
}
function inSession(){
  const d=new Date(),w=d.getDay();
  if(w===0||w===6)return false;
  const m=d.getHours()*60+d.getMinutes();
  return (m>=570&&m<=690)||(m>=780&&m<=900);
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';
    setTimeout(()=>el.remove(),320);},2600);
}

/* ==================== 4. 行情数据层（全部真实接口，无随机数） ==================== */
const EM='https://push2.eastmoney.com', EMH='https://push2his.eastmoney.com';
const UT='fa5fd1943c7b386f172d6893dbfba10b';
const FIELDS='f2,f3,f4,f5,f6,f8,f10,f12,f13,f14,f15,f16,f17,f18,f22,f62,f184,f124';

let jpN=0;
function jsonp(url,ms){
  ms=ms||9000;
  return new Promise((ok,no)=>{
    const cb='__kjcb'+(++jpN), s=document.createElement('script');
    const tid=setTimeout(()=>{fin();no(new Error('请求超时'));},ms);
    function fin(){clearTimeout(tid);try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();}
    window[cb]=d=>{fin();ok(d);};
    s.onerror=()=>{fin();no(new Error('脚本加载失败'));};
    s.src=url+(url.indexOf('?')<0?'?':'&')+'cb='+cb;
    document.head.appendChild(s);
  });
}
/* 4.1 批量快照（自选 + 指数，一次请求搞定） */
async function emList(secids){
  const u=EM+'/api/qt/ulist.np/get?ut='+UT+'&fltt=2&invt=2&fields='+FIELDS+'&secids='+secids.join(',');
  const d=await jsonp(u);
  return (d&&d.data&&d.data.diff)||[];
}
/* 4.2 分时（真实均价线也取回来） */

    '&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f53,f56,f58';

}

    '&fs='+encodeURIComponent(US_FS)+'&fields='+FIELDS;

  })).filter(x=>x.name);

/* 4.5 备用源：腾讯行情（只需基础字段，防东财被限流时页面空白） */
function txQuotes(list){
  return new Promise(ok=>{
    const s=document.createElement('script');
    s.src='https://qt.gtimg.cn/q='+list.join(',')+'&_='+Date.now();
    s.onload=()=>{
      const out={};
      list.forEach(c=>{const v=window['v_'+c];if(typeof v==='string')out[c]=v.split('~');});
      s.remove();ok(out);
    };
    s.onerror=()=>{s.remove();ok({});};
    document.head.appendChild(s);
  });
}
async function syncTx(codes){
  const list=codes.map(txCode);
  const res=await txQuotes(list);let got=0;
  codes.forEach((c,i)=>{
    const a=res[list[i]];if(!a||a.length<50)return;
    const q=quotes[c];if(!q)return;
    q.price=+a[3];q.prevClose=+a[4];q.open=+a[5];q.high=+a[33];q.low=+a[34];
    q.vol=+a[36];q.amt=(+a[37]||0)*1e4;q.turnover=+a[38]||null;q.volRatio=+a[49]||null;
    q.speed=null;q.fundRatio=null;q.inflow=null;q.ts=Date.now();
    if(!Number.isFinite(q.price))q.price=null; else got++;
  });
  return got;
}
/* 4.6 把接口行写入 quotes */
const quotes={};
function mkQuote(code,name,sector){
  return {code,name,sector,price:null,prevClose:null,open:null,high:null,low:null,
    vol:null,amt:null,turnover:null,volRatio:null,speed:null,fundRatio:null,inflow:null,
    minute:[],daily:[],ts:0,cd:{},hot:{}};
}
STOCKS.forEach(s=>quotes[s.code]=mkQuote(s.code,s.name,s.sector));
INDEX_DEFS.forEach(i=>quotes[i.code]=mkQuote(i.code,i.name,'指数'));
OUT_DEFS.forEach(o=>quotes[o.code]=mkQuote(o.code,o.name,'外围'));

function applyRow(r,map){
  const code=map[(r.f13||'')+'.'+(r.f12||'')];
  if(!code)return;
  const q=quotes[code];if(!q)return;
  const p=num(r.f2);if(p==null)return;
  q.price=p;q.prevClose=num(r.f18);q.open=num(r.f17);
  q.high=num(r.f15);q.low=num(r.f16);
  q.vol=num(r.f5);q.amt=num(r.f6);q.turnover=num(r.f8);q.volRatio=num(r.f10);
  q.speed=num(r.f22);q.inflow=num(r.f62);q.fundRatio=num(r.f184);
  q.ts=r.f124?r.f124*1000:Date.now();
}
async function loadTrends(code){
  const sd=secid(code);if(!sd)return;
  try{
    const d=await emTrends(sd);if(!d)return;
    const q=quotes[code];if(!q)return;
    if(num(d.preClose)!=null)q.prevClose=d.preClose;
    q.minute=(d.trends||[]).map(s=>{
      const a=s.split(',');
      return {t:(a[0]||'').slice(11,16),p:parseFloat(a[1]),v:parseFloat(a[2])||0,av:parseFloat(a[3])};
    }).filter(x=>isFinite(x.p));
  }catch(e){}
}
async function loadKline(code){
  const sd=secid(code);if(!sd)return;
  try{
    const d=await emKline(sd);if(!d)return;
    const q=quotes[code];if(!q)return;
    q.daily=(d.klines||[]).map(k=>{
      const a=k.split(',');
      return {o:+a[1],c:+a[2],h:+a[3],l:+a[4],v:+a[5],d:a[0]};
    }).filter(b=>isFinite(b.c));
  }catch(e){}
}
/* 4.7 主同步 */
function paint(){schedulePaint();}
async function sync(){
  if(syncing)return;syncing=true;
  try{
    const codes=STOCKS.map(s=>s.code);
    const map={};
    codes.forEach(c=>{const sd=secid(c);if(sd)map[sd]=c;});
    INDEX_DEFS.forEach(i=>map[i.code]=i.code);
    const rows=await emList(Object.keys(map));
    if(!rows.length)throw new Error('接口返回空');
    rows.forEach(r=>applyRow(r,map));
    failCount=0;srcName='东方财富';setNet(true,'实时 '+nowTime());
    const now=Date.now();
    if(selected&&now-lastTrend>12000){lastTrend=now;loadTrends(selected).then(paint);}
    if(now-lastBoardAt>30000){
      lastBoardAt=now;
      emBoard().then(b=>{board=b;paint();}).catch(()=>{});
    }
    if(chartMode==='kline'&&selected&&now-lastKlineAt>300000){
      lastKlineAt=now;loadKline(selected).then(paint);
    }
    radarScan();
    // 外围指数单独请求，失败不影响主流程
    const ids=OUT_DEFS.map(o=>o.code);
    emList(ids).then(rs=>{
      const m={};OUT_DEFS.forEach(o=>m[o.code]=o.code);
      rs.forEach(r=>applyRow(r,m));
      paint();
    }).catch(()=>{});
    okCount++;lastFull=now;
  }catch(e){
    failCount++;
    if(failCount>=2){
      const got=await syncTx([...STOCKS.map(s=>s.code),...INDEX_DEFS.map(i=>i.code)]).catch(()=>0);
      if(got){srcName='腾讯备用源';setNet(true,'备用源 '+nowTime());radarScan();}
      else setNet(false,'数据获取失败');
    }else setNet(false,'重试中…');
  }finally{syncing=false;schedulePaint();}
}
function setNet(ok,msg){
  net={ok,msg};
  const el=$('net');if(!el)return;
  el.className='net '+(ok?'ok':'err');
  el.textContent=(ok?'● ':'▲ ')+msg;
}

function scheduleNext(){

  const wait=inSession()?cfg.interval:20000;

/* ==================== 5. 雷达（真实字段 · 边沿触发 · 限频） ==================== */
const ICON={speed:'⚡',volume:'📊',fund:'💰',limit:'🔴'};
let lastNotif=0,lastBeep=0,audio=null;
function eventUp(ev){return !/(跌|出逃|下杀)/.test(ev.title);}
function beep(severe){
  if(!cfg.sound)return;
  const n=Date.now();if(n-lastBeep<1500)return;lastBeep=n;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    const o=audio.createOscillator(),g=audio.createGain();
    o.connect(g);g.connect(audio.destination);
    o.type='sine';o.frequency.value=severe?920:620;
    g.gain.setValueAtTime(.0001,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.16,audio.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.38);
    o.start();o.stop(audio.currentTime+.42);
  }catch(e){}
}
function notify(title,body){
  if(!cfg.notif||!('Notification'in window)||Notification.permission!=='granted')return;
  const n=Date.now();if(n-lastNotif<8000)return;lastNotif=n;
  try{new Notification(title,{body:body});}catch(e){}
}
function pushEvent(stock,type,title,text,severe){
  const q=quotes[stock.code];
  const now=Date.now();
  if(q.cd[type]&&now-q.cd[type]<60000)return;   // 同一规则 60 秒内不重复
  q.cd[type]=now;
  events.unshift({name:stock.name,code:stock.code,type,title,text,t:nowTime(),sev:!!severe});
  if(events.length>60)events.pop();
  beep(severe&&eventUp({title}));
  notify('科技雷达 · '+stock.name,text);
  /* 这里不做 innerHTML：由 schedulePaint() 合并到下一帧 */
}
function edge(q,key,hit,cb){
  if(hit&&!q.hot[key]){q.hot[key]=true;cb();}
  if(!hit)q.hot[key]=false;
}
function radarScan(){
  const R=cfg.radar;
  STOCKS.forEach(s=>{
    const q=quotes[s.code];
    if(!q||num(q.price)==null)return;
    if(R.scope==='watch'&&watchlist.indexOf(s.code)<0)return;
    /* 涨速 */
    if(num(q.speed)!=null){
      const hit=Math.abs(q.speed)>=R.speedTh;
      edge(q,'speed',hit,()=>pushEvent(s,'speed',q.speed>=0?'急拉':'急跌',
        '涨速 '+q.speed.toFixed(2)+'%',Math.abs(q.speed)>=R.speedTh*2));
    }
    /* 量比 */
    if(!isExt(s.code)&&num(q.volRatio)!=null){
      const hit=q.volRatio>=R.volTh;
      edge(q,'vol',hit,()=>pushEvent(s,'volume',(pct(q)||0)>=0?'放量上攻':'放量下杀',
        '量比 '+q.volRatio.toFixed(2)+' · '+fPct(pct(q)),q.volRatio>=R.volTh*1.6));
    }
    /* 主力资金（真实净占比） */
    if(!isExt(s.code)&&num(q.fundRatio)!=null){
      const up=q.fundRatio>=R.fundTh, dn=q.fundRatio<=-R.fundTh;
      edge(q,'fund',up||dn,()=>pushEvent(s,'fund',up?'主力抢筹':'主力出逃',
        '主力净占比 '+q.fundRatio.toFixed(2)+'%'+(num(q.inflow)!=null?' · 净'+(up?'流入':'流出')+' '+fAmt(Math.abs(q.inflow)):''),true));
    }
    /* 涨跌停临近 */
    if(!isExt(s.code)&&num(q.prevClose)!=null){
      const p=pct(q);if(p!=null){
        const lim=limitPct(s.code);
        const near=p>=lim-R.limitDist||p<=-(lim-R.limitDist);
        edge(q,'limit',near,()=>pushEvent(s,'limit',p>=0?'冲击涨停':'逼近跌停','涨幅 '+p.toFixed(2)+'%',true));
      }
    }
  });
}

/* ---- 图表 ---- */
const canvas=$('chart'), ctx=canvas.getContext('2d');
function fitCanvas(){
  const dpr=window.devicePixelRatio||1, r=canvas.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return r;
}
const maxOf=a=>{let m=-Infinity;for(let i=0;i<a.length;i++)if(a[i]>m)m=a[i];return m;};
const minOf=a=>{let m=Infinity;for(let i=0;i<a.length;i++)if(a[i]<m)m=a[i];return m;};
function drawChart(){
  const r=fitCanvas(),W=r.width,H=r.height;
  ctx.clearRect(0,0,W,H);
  const q=quotes[selected];
  if(!q||W<60||H<60)return;
  if(chartMode==='min')drawMin(q,W,H);else drawK(q,W,H);
}
function emptyText(W,H,msg){
  ctx.fillStyle='#8b949e';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(msg,W/2,H/2);ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawMin(q,W,H){
  const pts=q.minute||[], prev=num(q.prevClose);
  if(!pts.length||prev==null){emptyText(W,H,'分时数据加载中…');return;}
  const padL=6,padR=58,padT=16,padB=20, cw=W-padL-padR, ch=H-padT-padB;
  let dev=.002;pts.forEach(x=>{dev=Math.max(dev,Math.abs(x.p-prev)/prev);});
  dev=Math.min(dev,.12);
  const hi=prev*(1+dev), lo=prev*(1-dev), rng=hi-lo||1;
  const y=v=>padT+(hi-v)/rng*ch, x=i=>padL+i/Math.max(1,pts.length-1)*cw;
  /* 网格 + 昨收 */
  ctx.strokeStyle='#2a313c';ctx.lineWidth=1;ctx.font='10px sans-serif';ctx.fillStyle='#8b949e';
  for(let i=0;i<=4;i++){const yy=padT+ch*i/4;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
    ctx.fillText((hi-rng*i/4).toFixed(2),W-padR+4,yy+3);}
  ctx.setLineDash([4,3]);ctx.strokeStyle='#6e7681';
  ctx.beginPath();ctx.moveTo(padL,y(prev));ctx.lineTo(W-padR,y(prev));ctx.stroke();ctx.setLineDash([]);
  /* 均价线（接口真实 f58） */
  if(pts.some(p=>isFinite(p.av))){
    ctx.strokeStyle='#e6b800';ctx.lineWidth=1;ctx.beginPath();let st=false;
    pts.forEach((p,i)=>{if(!isFinite(p.av))return;st?ctx.lineTo(x(i),y(p.av)):ctx.moveTo(x(i),y(p.av));st=true;});
    ctx.stroke();
  }
  /* 价格线 + 面积 */
  const up=(num(q.price)!=null?q.price:prev)>=prev, col=up?'#f5455c':'#22c55e';
  const lp=pts[pts.length-1].p;
  ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.p)):ctx.moveTo(x(i),y(p.p)));
  ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.stroke();
  ctx.lineTo(x(pts.length-1),padT+ch);ctx.lineTo(x(0),padT+ch);ctx.closePath();
  ctx.fillStyle=up?'rgba(245,69,92,.12)':'rgba(34,197,94,.12)';ctx.fill();
  /* 最新价标签 */
  if(num(lp)!=null){
    ctx.fillStyle=col;ctx.fillRect(W-padR,padT+ch,x(0),0);
    ctx.beginPath();ctx.moveTo(x(0),y(lp));ctx.lineTo(x(pts.length-1),y(lp));
    ctx.strokeStyle=up?'rgba(245,69,92,.5)':'rgba(34,197,94,.5)';ctx.stroke();
    ctx.fillStyle=col;ctx.fillRect(W-padR,y(lp)-8,padR,16);
    ctx.fillStyle='#fff';ctx.fillText(lp.toFixed(2),W-padR+4,y(lp)+3);
  }
  /* 时间轴 */
  ctx.fillStyle='#8b949e';
  ['09:30','10:30','11:30/13:00','14:00','15:00'].forEach((t,i)=>{
    const tx=padL+cw*i/4;ctx.fillText(t,Math.min(tx,W-padR-46),H-6);});
  /* 图例 */
  ctx.fillStyle='#e6b800';ctx.fillText('— 均价',padL+2,9);
  ctx.fillStyle=col;ctx.fillText('— 价格',padL+52,9);
}
function drawK(q,W,H){
  const bars=q.daily||[];
  if(bars.length<5){emptyText(W,H,'日K数据加载中…');return;}
  const padL=6,padR=58,padT=16,padB=26;
  const cw=W-padL-padR, allH=H-padT-padB, ph=allH*.72, vh=allH*.28;
  const show=Math.min(bars.length,W<650?90:140), data=bars.slice(-show);
  const hi=maxOf(data.map(b=>b.h)), lo=minOf(data.map(b=>b.l)), rng=(hi-lo)||1;
  const y=v=>padT+(hi-v)/rng*ph, bw=Math.max(1,cw/show*.68);
  const bx=i=>padL+cw*(i+.5)/show, mv=maxOf(data.map(b=>b.v))||1;
  ctx.strokeStyle='#2a313c';ctx.font='10px sans-serif';ctx.fillStyle='#8b949e';
  for(let i=0;i<=4;i++){const yy=padT+ph*i/4;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
    ctx.fillText((hi-rng*i/4).toFixed(2),W-padR+4,yy+3);}
  data.forEach((b,i)=>{
    const red=b.c>=b.o;
    ctx.fillStyle=red?'rgba(245,69,92,.6)':'rgba(34,197,94,.6)';
    ctx.fillRect(bx(i)-bw/2,padT+ph+vh-b.v/mv*vh,bw,b.v/mv*vh);
    const col=red?'#f5455c':'#22c55e';
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx(i),y(b.h));ctx.lineTo(bx(i),y(b.l));ctx.stroke();
    ctx.fillRect(bx(i)-bw/2,y(Math.max(b.o,b.c)),bw,Math.max(1,Math.abs(y(b.o)-y(b.c))));
  });
  [[5,'#e6b800'],[10,'#3b82f6'],[20,'#a78bfa']].forEach(([n,col])=>{
    if(bars.length<n)return;
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();let st=false,s=0,q2=[];
    for(let i=0;i<bars.length;i++){s+=bars[i].c;if(i>=n)s-=bars[i-n].c;if(i>=n-1)q2.push(s/n);}
    const off=bars.length-show;
    q2.forEach((v,i)=>{const idx=i-(n-1);if(idx<off||idx-off>=show)return;
      const z=idx-off;st?ctx.lineTo(bx(z),y(v)):ctx.moveTo(bx(z),y(v));st=true;});
    ctx.stroke();
    ctx.fillStyle=col;ctx.fillText('MA'+n,padL+(n===5?2:n===10?46:90),9);
  });
  ctx.fillStyle='#8b949e';
  [0,Math.round(show*.5),show-1].forEach(i=>{
    if(!data[i])return;
    const tx=Math.min(Math.max(bx(i)-26,padL),W-padR-52);
    ctx.fillText((data[i].d||'').slice(5),tx,H-6);
  });
}

  if(!isExt(code)&&watchlist.filter(c=>!isExt(c)).length>=50){

function fillSet(){
  $('ivSel').value=String(cfg.interval);
  $('soundChk').checked=cfg.sound;$('notifChk').checked=cfg.notif;
  $('scopeSel').value=cfg.radar.scope;
  $('thSpeed').value=cfg.radar.speedTh;$('thVol').value=cfg.radar.volTh;
  $('thFund').value=cfg.radar.fundTh;$('thLimit').value=cfg.radar.limitDist;
}
$('setBtn').onclick=()=>{fillSet();$('setMask').hidden=false;};
$('setClose').onclick=()=>{$('setMask').hidden=true;};
$('setMask').onclick=e=>{if(e.target===$('setMask'))$('setMask').hidden=true;};
$('ivSel').onchange=()=>{cfg.interval=+$('ivSel').value;saveCfg();scheduleNext();toast('刷新频率 '+cfg.interval/1000+' 秒');};
$('soundChk').onchange=()=>{cfg.sound=$('soundChk').checked;saveCfg();if(cfg.sound)beep(true);};
$('notifChk').onchange=()=>{
  const on=$('notifChk').checked;
  if(on&&'Notification'in window){
    Notification.requestPermission().then(p=>{
      cfg.notif=(p==='granted');$('notifChk').checked=cfg.notif;saveCfg();
      if(!cfg.notif)toast('浏览器未授权通知');
    });
  }else{cfg.notif=false;saveCfg();}
};
$('scopeSel').onchange=()=>{cfg.radar.scope=$('scopeSel').value;saveCfg();};
['thSpeed','thVol','thFund','thLimit'].forEach(id=>{
  $(id).onchange=()=>{
    const v=parseFloat($(id).value);
    if(!isFinite(v))return;
    if(id==='thSpeed')cfg.radar.speedTh=Math.min(9,Math.max(.2,v));
    if(id==='thVol')cfg.radar.volTh=Math.min(10,Math.max(1.1,v));
    if(id==='thFund')cfg.radar.fundTh=Math.min(30,Math.max(1,v));
    if(id==='thLimit')cfg.radar.limitDist=Math.min(6,Math.max(.2,v));
    fillSet();saveCfg();paintRadar();
  };
});
$('selfChk').onclick=selfCheck;
$('clrBtn').onclick=()=>{
  if(!confirm('清空本机保存的自选股、备注与设置？'))return;
  localStorage.removeItem(LS.w);localStorage.removeItem(LS.c);localStorage.removeItem(LS.n);
  location.reload();
};
function saveCfg(){lset(LS.c,cfg);}
/* 图表尺寸变化 */
let rzTimer=null;
window.addEventListener('resize',()=>{clearTimeout(rzTimer);rzTimer=setTimeout(drawChart,150);});
window.addEventListener('orientationchange',()=>setTimeout(drawChart,300));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});

/* ==================== 8. 启动 ==================== */
fillSet();
paint();
scheduleNext();
sync();
setTimeout(sync,1500);
</script>
</body>
</html>
